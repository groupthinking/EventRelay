# gitleaks configuration for EventRelay.
# Extends gitleaks' default ruleset; allowlists vendored third-party assets and
# local-only audit artifacts that contain non-EventRelay tokens.
[extend]
useDefault = true

[allowlist]
description = "Paths excluded from secret scanning"
paths = [
  # Vendored saved web pages from Google (AI Studio / APIs Explorer): contain
  # Google's own public page keys, not EventRelay credentials.
  '''docs/gemini_reference/.*''',
  # Local-only security audit artifacts (gitignored; never committed).
  '''docs/security/.*''',
  # Test fixtures use obvious dummy keys (e.g. "xai-secret-123"), not real secrets.
  '''tests/.*''',
]

# Gitleaks v8.18.4 does not safely merge an allowlist-only same-ID rule with the
# inherited default rule. Repeat that pinned release's exact Square detector so
# the scanner cannot accidentally disable it while adding the narrow exception.
[[rules]]
id = "square-access-token"
description = "Detected a Square Access Token, risking unauthorized payment processing and financial transaction exposure."
regex = '''(?i)\b((EAAA|sq0atp-)[0-9A-Za-z\-_]{22,60})(?:['|\"|\n|\r|\s|\x60|;]|$)'''
keywords = [
  "sq0atp-",
  "eaaa",
]

  [rules.allowlist]
  description = "Generated uv.lock PyPI artifact checksum records"
  condition = "AND"
  regexTarget = "line"
  paths = ['''^uv\.lock$''']
  regexes = ['''^\s*\{\s*url\s*=\s*"https://files\.pythonhosted\.org/packages/[^"]+\.(?:whl|tar\.gz|zip)",\s*hash\s*=\s*"sha256:[0-9a-f]{64}",\s*size\s*=\s*[0-9]+,\s*upload-time\s*=\s*"[^"]+"\s*\},?\s*$''']

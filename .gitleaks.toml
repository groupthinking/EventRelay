# gitleaks configuration for EventRelay.
# Extends gitleaks' default ruleset; allowlists vendored third-party assets and
# local-only audit artifacts that contain non-EventRelay tokens.
[extend]
useDefault = true

[allowlist]
description = "Paths excluded from secret scanning"
paths = [
  # Vendored saved web pages from Google (AI Studio / APIs Explorer): contain
  # Google's own public page keys, not EventRelay credentials.
  '''docs/gemini_reference/.*''',
  # Local-only security audit artifacts (gitignored; never committed).
  '''docs/security/.*''',
  # Test fixtures use obvious dummy keys (e.g. "xai-secret-123"), not real secrets.
  '''tests/.*''',
  # Machine-generated lockfile: every `hash = "sha256:..."` entry is a PyPI
  # package integrity digest, not a credential. Their base64 entropy trips
  # high-entropy rules (e.g. square-access-token on the `parso` sdist hash),
  # failing the secret-scan gate repo-wide on a false positive.
  '''uv\.lock''',
]

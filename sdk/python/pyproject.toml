[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eventrelay-sdk"
version = "0.1.0"
description = "Type-safe Python SDK for the EventRelay API"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "EventRelay Team", email = "team@uvai.io"},
]
keywords = ["eventrelay", "youtube", "ai", "sdk", "api-client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "respx>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/groupthinking/EventRelay"
Documentation = "https://github.com/groupthinking/EventRelay/tree/main/sdk/python"
Repository = "https://github.com/groupthinking/EventRelay"

[tool.setuptools.packages.find]
where = ["."]
include = ["eventrelay_sdk*"]

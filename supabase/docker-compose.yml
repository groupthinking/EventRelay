version: '3.8'

services:
  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mcp_supabase
    volumes:
      - ./supabase_setup.sql:/docker-entrypoint-initdb.d/supabase_setup.sql
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: 
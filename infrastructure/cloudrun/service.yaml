# Cloud Run Service Configuration for UVAI Backend
# Documentation: https://cloud.google.com/run/docs/reference/yaml

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: uvai-backend
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        # Allow up to 10 instances for scalability with cost control
        autoscaling.knative.dev/maxScale: "10"
        autoscaling.knative.dev/minScale: "0"
        # CPU allocation: always allocated for consistent performance
        run.googleapis.com/cpu-throttling: "false"
        # Startup CPU boost for faster cold starts
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      # Allow 80 concurrent requests per container (FastAPI handles concurrency well)
      containerConcurrency: 80
      # 60 minute timeout – required for long-video Gemini analysis and
      # for the Cloud Tasks task-handler (/api/v3/process-video-task)
      timeoutSeconds: 3600
      serviceAccountName: uvai-backend@uvai-730bb.iam.gserviceaccount.com
      containers:
        - image: gcr.io/uvai-730bb/uvai-backend:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: "2Gi"
              cpu: "2"
          env:
            - name: PORT
              value: "8080"
            - name: LOG_LEVEL
              value: "INFO"
            - name: ENHANCED_ANALYSIS_DIR
              value: "/app/data/enhanced_analysis"
            # Secrets from Secret Manager
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: GEMINI_API_KEY
                  key: latest
            - name: YOUTUBE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: YOUTUBE_API_KEY
                  key: latest
            # Optional: Additional API keys
            # - name: OPENAI_API_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: OPENAI_API_KEY
            #       key: latest
          # Startup probe: wait for app to be ready
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 30
          # Liveness probe: check if app is healthy
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
  traffic:
    - percent: 100
      latestRevision: true

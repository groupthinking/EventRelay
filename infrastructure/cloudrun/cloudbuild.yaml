# Cloud Build configuration for UVAI Backend
# Builds the Docker image directly in GCP (no local Docker required)
# Trigger: gcloud builds submit --config infrastructure/cloudrun/cloudbuild.yaml .

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/uvai-backend/api:$BUILD_ID'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/uvai-backend/api:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  # Step 2: Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/uvai-backend/api:$BUILD_ID'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/uvai-backend/api:latest'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'uvai-backend'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/uvai-backend/api:$BUILD_ID'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '300s'
      - '--concurrency'
      - '80'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-secrets'
      - 'GEMINI_API_KEY=GEMINI_API_KEY:latest,YOUTUBE_API_KEY=YOUTUBE_API_KEY:latest'
      - '--set-env-vars'
      - 'LOG_LEVEL=INFO,ENHANCED_ANALYSIS_DIR=/app/data/enhanced_analysis'
      - '--allow-unauthenticated'
      - '--cpu-boost'
      - '--no-cpu-throttling'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/uvai-backend/api:$BUILD_ID'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/uvai-backend/api:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1200s'

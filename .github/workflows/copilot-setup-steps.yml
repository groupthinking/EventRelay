name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 59
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install JavaScript dependencies
        run: npm install --legacy-peer-deps

      - name: Install Python dependencies
        run: pip install -e .[dev]

      - name: Install HyperFrames CLI
        run: npm install -g hyperframes@0.5.5

      - name: Install HyperFrames agent skills
        run: npx --yes skills@1.5.6 add heygen-com/hyperframes

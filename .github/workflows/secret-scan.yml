name: Secret Scan

# Blocks PRs/pushes that introduce secrets into the working tree.
# Scans the checked-out tree (--no-git) rather than full history, so it is not
# blocked by pre-existing secrets still present in git history (purge those
# separately with git filter-repo). Pairs with the gitleaks pre-commit hook.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (working tree)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.18.4"
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL "${BASE}/${TARBALL}" -o /tmp/gitleaks.tgz
          curl -sSfL "${BASE}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o /tmp/gitleaks.sha256
          # Verify integrity before executing the downloaded binary.
          ( cd /tmp && grep " ${TARBALL}$" gitleaks.sha256 | sha256sum -c - )
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan working tree for secrets
        run: gitleaks detect --no-git --config .gitleaks.toml --redact --verbose --exit-code 1

name: Secret Scan

# Blocks PRs/pushes that introduce secrets into the working tree.
# Scans the checked-out tree (--no-git) rather than full history, so it is not
# blocked by pre-existing secrets still present in git history (purge those
# separately with git filter-repo). Pairs with the gitleaks pre-commit hook.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan working tree for secrets
        run: gitleaks detect --no-git --redact --verbose --exit-code 1

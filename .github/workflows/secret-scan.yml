name: Secret Scan

# Blocks PRs/pushes that introduce secrets into the working tree.
# Scans the checked-out tree (--no-git) rather than full history, so it is not
# blocked by pre-existing secrets still present in git history (purge those
# separately with git filter-repo). Pairs with the gitleaks pre-commit hook.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Keyed by PR number for PR runs and by commit SHA otherwise. The previous
# github.ref key collided every merge to main into one group, where GitHub
# cancels the pending run -- a burst of merges silently dropped the middle
# commits' verdicts. See the fuller note in ci.yml.
concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  gitleaks:
    name: gitleaks (working tree)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.18.4"
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          cd /tmp
          # Download under the real asset name so the checksum line resolves it.
          curl -sSfL "${BASE}/${TARBALL}" -o "${TARBALL}"
          curl -sSfL "${BASE}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          # Verify integrity before executing the downloaded binary.
          grep " ${TARBALL}$" checksums.txt | sha256sum -c -
          tar -xzf "${TARBALL}" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan working tree for secrets
        run: gitleaks detect --no-git --config .gitleaks.toml --redact --verbose --exit-code 1

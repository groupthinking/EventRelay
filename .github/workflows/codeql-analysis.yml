name: "CodeQL Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: "Security Scan - ${{ matrix.language }}"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript', 'python' ]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    
    - name: Cache dependencies (Python)
      if: matrix.language == 'python'
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
    
    - name: Cache dependencies (Node)
      if: matrix.language == 'javascript'
      uses: actions/cache@v5
      with:
        path: apps/web/node_modules
        key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
    
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        config-file: ./.github/codeql/codeql-config.yml
    
    - name: Autobuild
      uses: github/codeql-action/autobuild@v4
    
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
        wait-for-processing: true

# Dependency / supply-chain scanning is handled by dedicated workflows:
#   - dependency-review.yml  (PR-time review of new dependencies)
#   - security.yml           (npm audit, safety, bandit, trivy)
# The previous OWASP dependency-check job was removed: it was pinned to an
# unstable @main ref and pointed at paths that no longer exist (frontend/,
# src/mcp-bridge.py), so it produced no usable SARIF.

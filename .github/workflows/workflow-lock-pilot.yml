name: Workflow lock pilot

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  scoped-lock-validation:
    if: github.head_ref == 'test/actions-lock-dependency-review' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Download verified official CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 60 \
            https://github.com/github/gh-actions-lock/releases/download/v0.4.0/linux-amd64 \
            --output "$RUNNER_TEMP/gh-actions-lock"
          echo "f9da98f2a6e9e0ae77deadf9a2319a8a86bb002b541cc3203b247cc59fb04842  $RUNNER_TEMP/gh-actions-lock" | sha256sum --check
          chmod +x "$RUNNER_TEMP/gh-actions-lock"
          "$RUNNER_TEMP/gh-actions-lock" --version
      - name: Generate and verify only dependency-review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/gh-actions-lock"
          workflow=.github/workflows/dependency-review.yml
          set +e
          "$tool" --verify-local "$workflow"
          baseline_status=$?
          set -e
          test "$baseline_status" -eq 1
          "$tool" --no-interactive "$workflow"
          "$tool" --verify-local "$workflow"
          "$tool" --verify "$workflow"
          git diff --check
          cp "$workflow" "$RUNNER_TEMP/dependency-review.verified.yml"
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/dependency-review.yml')
          text = p.read_text()
          import re
          changed, count = re.subn(r'uses: actions/checkout@[^\s]+', 'uses: actions/checkout@v0.0.0-pilot-missing', text, count=1)
          assert count == 1
          p.write_text(changed)
          PY
          set +e
          "$tool" --verify-local "$workflow"
          negative_status=$?
          set -e
          cp "$RUNNER_TEMP/dependency-review.verified.yml" "$workflow"
          test "$negative_status" -eq 1
          "$tool" --verify-local "$workflow"
          python - <<'PY'
          import base64, hashlib, json, subprocess
          from pathlib import Path
          paths = ['.github/workflows/actions.lock', '.github/workflows/dependency-review.yml']
          status = subprocess.check_output(['git', 'status', '--porcelain'], text=True)
          changed = {line[3:] for line in status.splitlines()}
          assert changed == set(paths), status
          for path in paths:
              raw = Path(path).read_bytes()
              print('PILOT_FILE_JSON=' + json.dumps({'path': path, 'sha256': hashlib.sha256(raw).hexdigest(), 'base64': base64.b64encode(raw).decode()}))
          print('PILOT_VERIFIED: generation, local, online, negative, restore, scoped diff')
          PY

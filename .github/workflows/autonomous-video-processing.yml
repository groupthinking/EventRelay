name: Autonomous Video Processing

on:
  workflow_dispatch:
    inputs:
      categories:
        description: 'Comma-separated categories to process (e.g. tech,science,education,news)'
        required: false
        default: 'tech,science,education,news'
        type: string
      videos_per_category:
        description: 'Number of videos to process per category'
        required: false
        default: '5'
        type: string
      pipeline_mode:
        description: 'discovery = discover + manifest only; full = run every agent stage'
        required: false
        default: 'discovery'
        type: choice
        options:
          - discovery
          - full
      dry_run:
        description: 'Dry run (skip actual processing, only list videos)'
        required: false
        default: false
        type: boolean
      max_videos_per_run:
        description: 'Hard cap on total videos across all categories (fails closed)'
        required: false
        default: '50'
        type: string
      max_model_calls:
        description: 'Hard cap on total model calls across the run (fails closed)'
        required: false
        default: '200'
        type: string
  workflow_call:
    inputs:
      categories:
        description: 'Comma-separated categories to process'
        required: false
        default: 'tech,science,education,news'
        type: string
      videos_per_category:
        description: 'Number of videos to process per category'
        required: false
        default: '5'
        type: string
      pipeline_mode:
        description: 'discovery = discover + manifest only; full = run every agent stage'
        required: false
        default: 'discovery'
        type: string
      dry_run:
        description: 'Dry run (skip actual processing, only list videos)'
        required: false
        default: false
        type: boolean
      max_videos_per_run:
        description: 'Hard cap on total videos across all categories (fails closed)'
        required: false
        default: '50'
        type: string
      max_model_calls:
        description: 'Hard cap on total model calls across the run (fails closed)'
        required: false
        default: '200'
        type: string
    secrets:
      YOUTUBE_API_KEY:
        description: 'YouTube Data API v3 key — required for discovery'
        required: true
      GEMINI_API_KEY:
        description: 'Gemini API key — required when pipeline_mode is full'
        required: false
    outputs:
      final_status:
        description: 'delivered | discovery-only | dry-run | blocked | failed'
        value: ${{ jobs.summary.outputs.final_status }}
      delivered:
        description: 'Number of videos that completed every stage including QA'
        value: ${{ jobs.summary.outputs.delivered }}
      blocked:
        description: 'Number of videos blocked or failed by a stage'
        value: ${{ jobs.summary.outputs.blocked }}

permissions:
  contents: read

concurrency:
  group: autonomous-video-processing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Preflight and batch plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate required secrets
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIPELINE_MODE: ${{ inputs.pipeline_mode }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${YOUTUBE_API_KEY:-}" ] || missing+=("YOUTUBE_API_KEY")
          if [ "${PIPELINE_MODE}" = "full" ]; then
            [ -n "${GEMINI_API_KEY:-}" ] || missing+=("GEMINI_API_KEY")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secret(s): ${missing[*]}"
            exit 1
          fi
          echo "All required secrets present for mode '${PIPELINE_MODE}'."

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build category matrix and enforce run guardrails
        id: build-matrix
        env:
          CATEGORIES: ${{ inputs.categories }}
          VIDEOS_PER_CATEGORY: ${{ inputs.videos_per_category }}
          PIPELINE_MODE: ${{ inputs.pipeline_mode }}
          MAX_VIDEOS_PER_RUN: ${{ inputs.max_videos_per_run }}
          MAX_MODEL_CALLS: ${{ inputs.max_model_calls }}
        run: python scripts/ci/autonomous_video_plan.py

  process:
    name: Process ${{ matrix.category }} videos
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
      max-parallel: 4
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -e .[youtube,ml] 2>/dev/null || pip install yt-dlp requests

      - name: Process ${{ matrix.category }} videos
        id: process
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CATEGORY: ${{ matrix.category }}
          VIDEOS_PER_CATEGORY: ${{ inputs.videos_per_category }}
          PIPELINE_MODE: ${{ inputs.pipeline_mode }}
          DRY_RUN: ${{ inputs.dry_run }}
          MAX_VIDEOS_PER_RUN: ${{ inputs.max_videos_per_run }}
          MAX_MODEL_CALLS: ${{ inputs.max_model_calls }}
          OUTPUT_DIR: pipeline_output/${{ matrix.category }}
        run: python scripts/ci/autonomous_video_processing.py

      # Evidence is always retained — it is how a blocked run is diagnosed.
      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-evidence-${{ matrix.category }}
          path: pipeline_output/${{ matrix.category }}/
          retention-days: 30
          if-no-files-found: warn

      # Deliverables are published only when the QA stage cleared the run.
      - name: Publish deliverables
        if: steps.process.outputs.final_status == 'delivered'
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-deliverables-${{ matrix.category }}
          path: |
            pipeline_output/${{ matrix.category }}/videos/
            youtube_processed_videos/
          retention-days: 30
          if-no-files-found: ignore

  summary:
    name: Processing summary
    needs: process
    if: always()
    runs-on: ubuntu-latest
    outputs:
      final_status: ${{ steps.aggregate.outputs.final_status }}
      delivered: ${{ steps.aggregate.outputs.delivered }}
      blocked: ${{ steps.aggregate.outputs.blocked }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: pipeline-evidence-*
          path: evidence
          merge-multiple: false
        continue-on-error: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Aggregate run manifests
        id: aggregate
        env:
          EVIDENCE_DIR: evidence
          PROCESS_RESULT: ${{ needs.process.result }}
          CATEGORIES: ${{ inputs.categories }}
          VIDEOS_PER_CATEGORY: ${{ inputs.videos_per_category }}
          PIPELINE_MODE: ${{ inputs.pipeline_mode }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python scripts/ci/autonomous_video_summary.py

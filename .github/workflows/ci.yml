name: CI

on:
  push:
    branches: [main]
  # No base-branch filter. A `branches:` allowlist here gates on the PR's *base*,
  # so a PR stacked onto another PR's branch ran no CI at all (see #1440, which
  # targets #1381's branch and has zero CI runs). Every PR gets the gate; the
  # push trigger above stays scoped to main.
  pull_request:

permissions:
  contents: read
  actions: read


# Supersede superseded work instead of stacking it. Without this, every push
# to a PR branch queued a brand-new full run alongside the ones it obsoleted;
# with ~30 workflows and dozens of open PRs the Actions queue could not drain.
#
# PR runs are keyed by PR number and cancel their predecessors -- that is where
# all the queue pressure comes from, since every `push:` trigger here is already
# filtered to main. Non-PR runs (push, schedule) are keyed by commit SHA so they
# land in singleton groups: keying them on github.ref would collide every merge
# to main into one group, and GitHub cancels the *pending* run in a group, so a
# burst of merges would silently drop the middle commits' verdicts.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  guards:
    # Fail fast on the class of breakage that shipped to main un-caught:
    # committed merge-conflict markers and import-time Python SyntaxErrors.
    # (main previously carried unresolved markers in 10 files because the
    # pipeline had no syntax gate — see PR #736.)
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Prevent long-running jobs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No committed merge-conflict markers
        run: |
          # Opening/closing conflict sentinels always carry a label after the
          # space, so this never matches decorative "=======" underlines.
          if git grep -nE '^(<<<<<<<|>>>>>>>) ' -- . ':(exclude).github/workflows/ci.yml'; then
            echo "::error::Committed merge-conflict markers found (see matches above)."
            exit 1
          fi
          echo "No conflict markers found."
      - name: No IDE self-identifiers in shared .vscode config
        run: |
          # VS Code forks (Antigravity, Cursor, Windsurf) write their own
          # extension IDs into workspace settings; those IDs resolve to
          # nothing in stock VS Code and fail silently. Mirrors the
          # vscode-ide-self-reference pre-commit hook, which not every
          # committer has installed.
          if git grep -nE 'google\.antigravity|anysphere\.|codeium\.windsurf' -- .vscode/; then
            echo "::error::IDE self-identifier found in shared .vscode/ config (see matches above)."
            exit 1
          fi
          echo "No IDE self-identifiers found."
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Python source compiles (no import-time SyntaxErrors)
        run: python -m compileall -q src/

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Prevent long-running jobs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --legacy-peer-deps
      - name: TypeScript type-check (apps/web)
        continue-on-error: true
        run: cd apps/web && npm run type-check
      - name: ESLint (apps/web)
        run: cd apps/web && npm run lint
      - name: Build web app
        run: npm run build:web
      - name: Verify Studio preflight against real services
        env:
          STUDIO_PREFLIGHT_REPORT: ${{ runner.temp }}/studio-preflight-real/evidence.json
        run: npm --workspace=apps/web run test:studio-preflight:real -- --provision-redis
      - name: Retain real Studio preflight evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-preflight-real-${{ github.sha }}
          path: ${{ runner.temp }}/studio-preflight-real/
          if-no-files-found: error
          retention-days: 7
      - name: Build web production image
        run: docker build --file apps/web/Dockerfile .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifacts
          path: |
            apps/web/.next
          retention-days: 7

  lint-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Prevent long-running jobs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Lint Python (informational)
        continue-on-error: true
        run: ruff check src/youtube_extension/backend/ src/youtube_extension/main.py --ignore E402,F811,F401,F821,B904,B020,E701,E722

  lint-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Prevent long-running jobs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --legacy-peer-deps
      - name: Lint Frontend (informational)
        continue-on-error: true
        run: cd apps/web && npm run lint

  # Required for apps/web unit tests (see #1449). The Python `test` job only
  # runs pytest; without this job, ~300 frontend tests including CWE-209 /
  # Stripe-leak regressions never gate merges.
  test-frontend:
    name: test-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Prevent long-running jobs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --legacy-peer-deps
      - name: Install Redis for Video Pack and Origin G.A.T.E. integration tests
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: Unit tests (apps/web)
        # Hermetic: do not inject ambient AI/billing keys (see #1230).
        env:
          ORIGIN_GATE_REDIS_TESTS: "1"
          OPENAI_API_KEY: ""
          AI_GATEWAY_API_KEY: ""
          VERCEL_AI_GATEWAY_API_KEY: ""
          STRIPE_SECRET_KEY: ""
          STRIPE_WEBHOOK_SECRET: ""
        run: npm --workspace=apps/web test -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/web-vitest-report.json"
      - name: Retain machine-readable test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-vitest-${{ github.sha }}
          path: ${{ runner.temp }}/web-vitest-report.json
          if-no-files-found: error
          retention-days: 7

  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Prevent long-running jobs
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.1"
          enable-cache: false
      - name: Check lockfile
        run: uv lock --check
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,youtube]"
      - name: Run tests
        # This is a fast unit-only sanity job. It measures coverage but must NOT
        # enforce the 88.1833% baseline: that figure (19,761 / 22,409 statements)
        # was measured over the FULL `tests/` suite in coverage.yml, which is the
        # authoritative gate. The unit subset (integration + one workflow file +
        # all top-level/e2e tests excluded) exercises strictly fewer code paths
        # against the same package-wide denominator, so a full-suite floor here
        # would fail every run. See coverage.yml for the enforced baseline.
        run: >-
          PYTHONPATH=src python -m pytest tests/unit/ -v --timeout=120
          --cov=src/youtube_extension
          --ignore=tests/unit/test_transcript_action_workflow.py -k "not integration"

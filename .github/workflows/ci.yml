name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  repo-integrity:
    # Hard gate: fails the build on committed merge-conflict markers or Python
    # syntax errors anywhere under src/ or tests/. Added because main once shipped
    # unresolved conflict markers in src/skills/*, src/agents/*, and
    # tests/test_skills_integration.py — invisible to the other jobs, whose ruff
    # (continue-on-error) and pytest (tests/unit only) scopes never touch those paths.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fail on committed merge-conflict markers
        run: |
          # Match conflict markers only at the start of a line in tracked files.
          if git grep -n -I -E '^(<<<<<<<|=======|>>>>>>>)( |$)' -- ':!*.md'; then
            echo "::error::Committed merge-conflict markers found (see matches above)."
            exit 1
          fi
          echo "No merge-conflict markers in tracked files."
      - name: Compile all Python sources
        run: |
          # Byte-compile every tracked .py file so SyntaxErrors fail CI.
          git ls-files -z '*.py' | xargs -0 python -m py_compile

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm install --legacy-peer-deps
      - name: TypeScript type-check (apps/web)
        run: cd apps/web && npm run type-check
      - name: ESLint (apps/web)
        run: cd apps/web && npm run lint
      - name: Build web app
        run: npm run build:web
      - uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            apps/web/.next
          retention-days: 7

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Lint Python (informational)
        continue-on-error: true
        run: ruff check src/youtube_extension/backend/ src/youtube_extension/main.py --ignore E402,F811,F401,F821,B904,B020,E701,E722

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm install --legacy-peer-deps
      - name: Lint Frontend (informational)
        continue-on-error: true
        run: cd apps/web && npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -e .[dev] 2>/dev/null || true
          pip install pydantic pytest pytest-asyncio fastapi httpx psutil aiofiles aiohttp starlette
      - name: Run tests
        run: PYTHONPATH=src python -m pytest tests/unit/ -v --override-ini="addopts=" --ignore=tests/unit/test_transcript_action_workflow.py -k "not integration"

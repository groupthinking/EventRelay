name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  guards:
    # Fail fast on the class of breakage that shipped to main un-caught:
    # committed merge-conflict markers and import-time Python SyntaxErrors.
    # (main previously carried unresolved markers in 10 files because the
    # pipeline had no syntax gate — see PR #736.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No committed merge-conflict markers
        run: |
          # Opening/closing conflict sentinels always carry a label after the
          # space, so this never matches decorative "=======" underlines.
          if git grep -nE '^(<<<<<<<|>>>>>>>) ' -- . ':(exclude).github/workflows/ci.yml'; then
            echo "::error::Committed merge-conflict markers found (see matches above)."
            exit 1
          fi
          echo "No conflict markers found."
      - name: No IDE self-identifiers in shared .vscode config
        run: |
          # VS Code forks (Antigravity, Cursor, Windsurf) write their own
          # extension IDs into workspace settings; those IDs resolve to
          # nothing in stock VS Code and fail silently. Mirrors the
          # vscode-ide-self-reference pre-commit hook, which not every
          # committer has installed.
          if git grep -nE 'google\.antigravity|anysphere\.|codeium\.windsurf' -- .vscode/; then
            echo "::error::IDE self-identifier found in shared .vscode/ config (see matches above)."
            exit 1
          fi
          echo "No IDE self-identifiers in .vscode/."
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Python source compiles (no import-time SyntaxErrors)
        run: python -m compileall -q src/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm install --legacy-peer-deps
      - name: TypeScript type-check (apps/web)
        continue-on-error: true
        run: cd apps/web && npm run type-check
      - name: ESLint (apps/web)
        run: cd apps/web && npm run lint
      - name: Build web app
        run: npm run build:web
      - uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            apps/web/.next
          retention-days: 7

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Lint Python (informational)
        continue-on-error: true
        run: ruff check src/youtube_extension/backend/ src/youtube_extension/main.py --ignore E402,F811,F401,F821,B904,B020,E701,E722

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm install --legacy-peer-deps
      - name: Lint Frontend (informational)
        continue-on-error: true
        run: cd apps/web && npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,youtube]"
      - name: Run tests
        run: PYTHONPATH=src python -m pytest tests/unit/ -v --timeout=120 --override-ini="addopts=" --ignore=tests/unit/test_transcript_action_workflow.py -k "not integration"

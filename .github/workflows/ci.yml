name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm install --legacy-peer-deps
      - name: Build web app
        run: npm run build:web
      - uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            apps/web/.next
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Lint Python (informational)
        continue-on-error: true
        run: ruff check src/youtube_extension/backend/ src/youtube_extension/main.py --ignore E402,F811,F401,F821,B904,B020,E701,E722

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -e .[dev] 2>/dev/null || true
          pip install pydantic pytest pytest-asyncio fastapi httpx psutil aiofiles aiohttp starlette
      - name: Run tests
        run: PYTHONPATH=src python -m pytest tests/unit/ -v --override-ini="addopts=" --ignore=tests/unit/test_temporal_video_analysis.py --ignore=tests/unit/test_transcript_action_workflow.py -k "not integration"

name: Dependabot Auto Merge

# GitHub recommendation (2026): use pull_request, not pull_request_target.
# Dependabot PRs from this repo get a writable GITHUB_TOKEN when permissions
# below are set. pull_request_target is being default-disabled on public repos
# (evaluate mode now; enforce 2026-11-02).
"on":
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  check_suite:
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  statuses: read
  # Required by the merge job's check-run readiness scan. Commit statuses and
  # check runs are separate surfaces with separate scopes; without this the
  # `checks.listForRef` call 403s.
  checks: read

concurrency:
  # check_suite is the exception to the github.sha fallback used elsewhere:
  # on that event GITHUB_SHA is the default branch tip, identical for every
  # PR, so github.sha alone would collapse all concurrent check-suite runs
  # into one group and drop merge-gate verdicts. check_suite.head_sha is the
  # PR head and keeps them isolated.
  group: dependabot-auto-merge-${{ github.event.pull_request.number || github.event.check_suite.head_sha || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependabot-auto-merge-approve:
    if: >-
      vars.DEPENDABOT_AUTO_MERGE_ENABLED == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.repository == 'groupthinking/EventRelay' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - uses: actions/github-script@v9
        with:
          script: |
            const pull_number = context.payload.pull_request.number;

            try {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number,
                event: 'APPROVE',
                body: 'Automatically approving Dependabot update.',
              });
            } catch (error) {
              if (error.status === 422) {
                core.info(`Approval already recorded for PR #${pull_number}.`);
              } else {
                throw error;
              }
            }

      - name: Enable auto-merge for patch/minor only
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        uses: actions/github-script@v9
        with:
          script: |
            const pull_number = context.payload.pull_request.number;
            try {
              await github.graphql(
                `
                  mutation EnableAutoMerge($pullRequestId: ID!) {
                    enablePullRequestAutoMerge(
                      input: { pullRequestId: $pullRequestId, mergeMethod: SQUASH }
                    ) {
                      pullRequest {
                        number
                      }
                    }
                  }
                `,
                { pullRequestId: context.payload.pull_request.node_id },
              );
              core.notice(`Enabled auto-merge for PR #${pull_number}.`);
            } catch (error) {
              core.info(`Auto-merge could not be enabled for PR #${pull_number}: ${error.message}`);
            }

  dependabot-auto-merge-merge:
    if: vars.DEPENDABOT_AUTO_MERGE_ENABLED == 'true' && github.event_name == 'check_suite' && github.event.check_suite.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const pullRequests = context.payload.check_suite.pull_requests ?? [];

            if (pullRequests.length === 0) {
              core.info('No pull requests associated with this check suite.');
              return;
            }

            for (const pullRequestRef of pullRequests) {
              const { data: pullRequest } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullRequestRef.number,
              });

              if (pullRequest.head?.sha !== context.payload.check_suite.head_sha) {
                core.info(
                  `Skipping PR #${pullRequest.number} because the check suite SHA does not match the PR head SHA.`,
                );
                continue;
              }
              if (pullRequest.user.login !== 'dependabot[bot]') {
                core.info(`Skipping PR #${pullRequest.number} because it was not opened by Dependabot.`);
                continue;
              }

              if (pullRequest.draft) {
                core.info(`Skipping draft PR #${pullRequest.number}.`);
                continue;
              }

              const { data: headCommit } = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: pullRequest.head.sha,
              });

              const updateTypes = [
                ...(headCommit.commit?.message ?? '').matchAll(
                  /^\s*update-type:\s*(\S+)\s*$/gm,
                ),
              ].map(match => match[1]);

              if (updateTypes.length === 0) {
                core.info(
                  `Could not determine update type for PR #${pullRequest.number}; skipping.`
                );
                continue;
              }

              const ALLOWED_UPDATE_TYPES = new Set([
                'version-update:semver-patch',
                'version-update:semver-minor',
              ]);
              const disallowed = updateTypes.filter(
                type => !ALLOWED_UPDATE_TYPES.has(type),
              );
              if (disallowed.length > 0) {
                core.info(
                  `Skipping PR #${pullRequest.number}; update type(s) outside the ` +
                    `patch/minor policy: ${disallowed.join(', ')}`,
                );
                continue;
              }

              const { data: combined } = await github.rest.repos.getCombinedStatusForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: pullRequest.head.sha,
              });

              if (combined.state !== 'success') {
                core.info(
                  `Skipping PR #${pullRequest.number} because combined status is ${combined.state}.`
                );
                continue;
              }

              const checkRuns = await github.paginate(
                github.rest.checks.listForRef,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: pullRequest.head.sha,
                  per_page: 100,
                  filter: 'latest',
                },
              );

              const SELF_JOBS = new Set([
                'dependabot-auto-merge-approve',
                'dependabot-auto-merge-merge',
              ]);
              const ACCEPTABLE = new Set(['success', 'skipped', 'neutral']);

              const REQUIRED_CHECKS = [
                'validate',
                'guards',
                'lint-python',
                'lint-frontend',
                'build',
                'test (Python 3.10)',
                'test (Python 3.11)',
                'test (Python 3.12)',
                'test-frontend',
                'CodeQL',
                'gitleaks (working tree)',
                'dependency-review',
                'Security Scan - python',
                'Security Scan - javascript',
                'bandit',
                'python-safety',
                'npm-audit',
                'trivy',
              ];

              const relevant = checkRuns.filter(run => !SELF_JOBS.has(run.name));
              const present = new Set(relevant.map(run => run.name));

              const missing = REQUIRED_CHECKS.filter(name => !present.has(name));
              if (missing.length > 0) {
                core.info(
                  `Skipping PR #${pullRequest.number}; required check run(s) not reported yet: ` +
                    missing.join(', '),
                );
                continue;
              }

              const unfinished = relevant.filter(run => run.status !== 'completed');
              const failed = relevant.filter(
                run => run.status === 'completed' && !ACCEPTABLE.has(run.conclusion),
              );

              if (unfinished.length > 0) {
                core.info(
                  `Skipping PR #${pullRequest.number}; ${unfinished.length} check run(s) still running: ` +
                    unfinished.map(run => run.name).join(', '),
                );
                continue;
              }

              if (failed.length > 0) {
                core.info(
                  `Skipping PR #${pullRequest.number}; failing check run(s): ` +
                    failed.map(run => `${run.name}=${run.conclusion}`).join(', '),
                );
                continue;
              }

              try {
                await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pullRequest.number,
                  merge_method: 'squash',
                });
                core.notice(`Merged Dependabot PR #${pullRequest.number}.`);
              } catch (error) {
                if (error.status === 405 || error.status === 409) {
                  core.info(`PR #${pullRequest.number} is not ready to merge yet: ${error.message}`);
                } else {
                  throw error;
                }
              }
            }

name: Dependabot Auto Merge

"on":
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  check_suite:
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  approve:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pull_number = context.payload.pull_request.number;

            try {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number,
                event: 'APPROVE',
                body: 'Automatically approving Dependabot update.',
              });
            } catch (error) {
              if (error.status === 422) {
                core.info(`Approval already recorded for PR #${pull_number}.`);
              } else {
                throw error;
              }
            }

            try {
              await github.graphql(
                `
                  mutation EnableAutoMerge($pullRequestId: ID!) {
                    enablePullRequestAutoMerge(
                      input: { pullRequestId: $pullRequestId, mergeMethod: SQUASH }
                    ) {
                      pullRequest {
                        number
                      }
                    }
                  }
                `,
                { pullRequestId: context.payload.pull_request.node_id },
              );
              core.notice(`Enabled auto-merge for PR #${pull_number}.`);
            } catch (error) {
              core.info(`Auto-merge could not be enabled for PR #${pull_number}: ${error.message}`);
            }

  merge:
    if: github.event_name == 'check_suite' && github.event.check_suite.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pullRequests = context.payload.check_suite.pull_requests ?? [];

            if (pullRequests.length === 0) {
              core.info('No pull requests associated with this check suite.');
              return;
            }

            for (const pullRequestRef of pullRequests) {
              const { data: pullRequest } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullRequestRef.number,
              });

              if (pullRequest.user.login !== 'dependabot[bot]') {
                core.info(`Skipping PR #${pullRequest.number} because it was not opened by Dependabot.`);
                continue;
              }

              if (pullRequest.draft) {
                core.info(`Skipping draft PR #${pullRequest.number}.`);
                continue;
              }

              try {
                await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pullRequest.number,
                  merge_method: 'squash',
                });
                core.notice(`Merged Dependabot PR #${pullRequest.number}.`);
              } catch (error) {
                if (error.status === 405 || error.status === 409) {
                  core.info(`PR #${pullRequest.number} is not ready to merge yet: ${error.message}`);
                } else {
                  throw error;
                }
              }
            }

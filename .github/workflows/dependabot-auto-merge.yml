name: Dependabot Auto Merge

"on":
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  check_suite:
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  statuses: read

jobs:
  approve:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.repository == 'groupthinking/EventRelay' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - uses: actions/github-script@v9
        with:
          script: |
            const pull_number = context.payload.pull_request.number;

            try {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number,
                event: 'APPROVE',
                body: 'Automatically approving Dependabot update.',
              });
            } catch (error) {
              if (error.status === 422) {
                core.info(`Approval already recorded for PR #${pull_number}.`);
              } else {
                throw error;
              }
            }

      - name: Enable auto-merge for patch/minor only
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        uses: actions/github-script@v9
        with:
          script: |
            const pull_number = context.payload.pull_request.number;
            try {
              await github.graphql(
                `
                  mutation EnableAutoMerge($pullRequestId: ID!) {
                    enablePullRequestAutoMerge(
                      input: { pullRequestId: $pullRequestId, mergeMethod: SQUASH }
                    ) {
                      pullRequest {
                        number
                      }
                    }
                  }
                `,
                { pullRequestId: context.payload.pull_request.node_id },
              );
              core.notice(`Enabled auto-merge for PR #${pull_number}.`);
            } catch (error) {
              core.info(`Auto-merge could not be enabled for PR #${pull_number}: ${error.message}`);
            }

  merge:
    if: github.event_name == 'check_suite' && github.event.check_suite.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const pullRequests = context.payload.check_suite.pull_requests ?? [];

            if (pullRequests.length === 0) {
              core.info('No pull requests associated with this check suite.');
              return;
            }

            for (const pullRequestRef of pullRequests) {
              const { data: pullRequest } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullRequestRef.number,
              });

              if (pullRequest.head?.sha !== context.payload.check_suite.head_sha) {
                core.info(
                  `Skipping PR #${pullRequest.number} because the check suite SHA does not match the PR head SHA.`,
                );
                continue;
              }
              if (pullRequest.user.login !== 'dependabot[bot]') {
                core.info(`Skipping PR #${pullRequest.number} because it was not opened by Dependabot.`);
                continue;
              }

              if (pullRequest.draft) {
                core.info(`Skipping draft PR #${pullRequest.number}.`);
                continue;
              }

              const metadata = await github.request(
                'GET /repos/{owner}/{repo}/pulls/{pull_number}',
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pullRequest.number,
                  mediaType: { previews: ['dorian'] },
                }
              );

              const updateType =
                metadata.data?.dependency?.update_type ??
                metadata.data?.update_type ??
                metadata.data?.dependency_update_type;

              if (!updateType) {
                core.info(
                  `Could not determine update type for PR #${pullRequest.number}; skipping.`
                );
                continue;
              }

              if (updateType.includes('semver-major')) {
                core.info(`Skipping major update PR #${pullRequest.number}.`);
                continue;
              }

              const { data: combined } = await github.rest.repos.getCombinedStatusForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: pullRequest.head.sha,
              });

              if (combined.state !== 'success') {
                core.info(
                  `Skipping PR #${pullRequest.number} because combined status is ${combined.state}.`
                );
                continue;
              }

              try {
                await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pullRequest.number,
                  merge_method: 'squash',
                });
                core.notice(`Merged Dependabot PR #${pullRequest.number}.`);
              } catch (error) {
                if (error.status === 405 || error.status === 409) {
                  core.info(`PR #${pullRequest.number} is not ready to merge yet: ${error.message}`);
                } else {
                  throw error;
                }
              }
            }

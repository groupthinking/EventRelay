# YAML configuration for Stale Bot
name: Close stale issues

# Prevent concurrent runs to avoid resource exhaustion
concurrency:
  group: stale-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Prevent long-running jobs
    steps:
      - name: Close stale issues and PRs
        uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: 'This issue has been automatically marked as stale due to inactivity.'
          stale-pr-message: 'This pull request has been automatically marked as stale due to inactivity.'
          days-before-stale: 30
          days-before-close: 7
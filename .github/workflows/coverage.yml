name: Coverage Report

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"

permissions:
  contents: read
  actions: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Generate and Upload Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # set to 1 if full history not needed

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run tests with coverage
        continue-on-error: true # Allow workflow to complete for coverage tracking
        run: |
          pytest tests/ \
            --cov=src/youtube_extension \
            --cov-report=lcov:reports/lcov.info \
            --cov-report=term \
            --cov-report=html:reports/htmlcov \
            --cov-fail-under=0 \
            -v || true

      - name: Upload coverage to Qlty (same-repo only)
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: qltysh/qlty-action/coverage@v2
        continue-on-error: true
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: reports/lcov.info

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            reports/lcov.info
            reports/htmlcov/
          retention-days: 30

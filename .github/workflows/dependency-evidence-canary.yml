name: Dependency comparison evidence canary
on:
  push:
    branches: [codex/dependency-trace-canary-20261110]
permissions:
  contents: read
jobs:
  trace:
    if: "github.event.head_commit.message != 'test: verify merged image artifact'"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch exact historical comparison objects
        run: git fetch --no-tags origin e1181c222579db5e433c0b9eb6223f84065e8202 cb9ed412bfb671a6568e3e00902bf239f00d3c29 4d17fe3ea4647b92f04b48bcdc1fde7e8670154e b7986634f97019fdd1057f0db306e6cb8749e033 25c5e936e2133d3448f539d5cc56211fc5e8aeeb
      - name: Capture real dependency API pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m scripts.ci.trace_dependency_comparison
      - name: Retain trace and diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dependency-comparison-trace-${{ github.sha }}-${{ github.run_attempt }}
          path: dependency-trace-evidence/
          if-no-files-found: error
          retention-days: 30
  image-artifact-proof:
    if: "github.event.head_commit.message == 'test: verify merged image artifact'"
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Independently validate exact merged image archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/verify_image_artifact_once.py
      - name: Retain archive and proof
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: merged-image-artifact-proof
          path: image-artifact-proof/
          if-no-files-found: error
          retention-days: 30

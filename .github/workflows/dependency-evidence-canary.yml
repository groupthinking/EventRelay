name: Dependency comparison evidence canary
on:
  push:
    branches: [codex/dependency-trace-canary-20261110]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch exact historical comparison objects
        run: git fetch --no-tags origin 3735132cdf6b0527630428cac3b24c9833f06d67 222c0f05a3f28338a35298a035d5b2b0de55f6aa 22ef7d129416019e341260ac534fd8adcff25b37 d98f998e19e6f042273e8f886011d2d0674ca28d
      - name: Capture real dependency API pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m scripts.ci.trace_dependency_comparison
      - name: Retain trace and diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dependency-comparison-trace-${{ github.sha }}-${{ github.run_attempt }}
          path: dependency-trace-evidence/
          if-no-files-found: error
          retention-days: 30

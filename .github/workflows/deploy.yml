name: Deploy

# Prevent concurrent runs to avoid resource exhaustion
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Version/tag to deploy (leave empty for latest)'
        required: false
        type: string
      skip_tests:
        description: 'Skip pre-deployment tests'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Validate Deployment Configuration
  validate:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      version: ${{ steps.set-env.outputs.version }}
      skip_tests: ${{ steps.set-env.outputs.skip_tests }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set deployment parameters
        id: set-env
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment }}"
          VERSION="${{ github.event.inputs.version }}"
          SKIP_TESTS="${{ github.event.inputs.skip_tests }}"

          if [ -z "$VERSION" ]; then
            VERSION="${{ github.sha }}"
          fi

          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "skip_tests=$SKIP_TESTS" >> $GITHUB_OUTPUT

      - name: Validate environment configuration
        run: |
          if [ ! -d "config/$ENVIRONMENT" ]; then
            echo "⚠️  Environment configuration directory not found: config/$ENVIRONMENT"
            echo "This may indicate incomplete setup - proceeding with caution"
          fi

      - name: Validate Kubernetes manifests
        run: |
          if [ ! -d "deployments/kubernetes/manifests" ]; then
            echo "❌ Kubernetes manifests not found"
            exit 1
          fi

          # Check for required manifests
          REQUIRED_MANIFESTS=("uvai-api-deployment.yaml" "uvai-api-service.yaml")
          for manifest in "${REQUIRED_MANIFESTS[@]}"; do
            if [ ! -f "deployments/kubernetes/manifests/$manifest" ]; then
              echo "❌ Required manifest missing: $manifest"
              exit 1
            fi
          done

      - name: Validate Terraform configuration (if present)
        run: |
          if [ -d "deployments/terraform" ]; then
            echo "✅ Terraform configuration found"
          else
            echo "⚠️  Terraform configuration not found - using Kubernetes-only deployment"
          fi

  # Pre-deployment Tests
  pre-deploy-tests:
    runs-on: ubuntu-latest
    needs: [validate]
    if: needs.validate.outputs.skip_tests == 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run smoke tests against current deployment
        run: |
          # This would test the currently deployed version
          echo "Running pre-deployment smoke tests..."
          # Add your smoke test commands here

      - name: Run database migrations check
        run: |
          echo "Checking database migration status..."
          # Add database migration validation here

  # Build Docker Images (if needed)
  build-images:
    runs-on: ubuntu-latest
    needs: [validate]
    if: github.event.inputs.version == ''
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.validate.outputs.version }}
            type=raw,value=latest

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy Infrastructure
  deploy-infrastructure:
    runs-on: ubuntu-latest
    needs: [validate, pre-deploy-tests]
    environment: ${{ needs.validate.outputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy with Terraform (if available)
        run: |
          if [ -d "deployments/terraform/environments/${{ needs.validate.outputs.environment }}" ]; then
            cd deployments/terraform/environments/${{ needs.validate.outputs.environment }}
            terraform init
            terraform plan -out=tfplan
            terraform apply -auto-approve tfplan
          else
            echo "Terraform configuration not found, skipping infrastructure deployment"
          fi

      - name: Configure Kubernetes
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Create namespace if it doesn't exist
        run: |
          kubectl create namespace uvai-${{ needs.validate.outputs.environment }} --dry-run=client -o yaml | kubectl apply -f -

  # Deploy Application
  deploy-application:
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, build-images]
    environment: ${{ needs.validate.outputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure Kubernetes
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Update image tags in manifests
        run: |
          # Update backend image
          find deployments/kubernetes/ -name "*.yaml" -exec sed -i "s|uvai/backend:.*|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.validate.outputs.version }}|g" {} \;

          # Update frontend image if it exists
          find deployments/kubernetes/ -name "*.yaml" -exec sed -i "s|uvai/frontend:.*|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ needs.validate.outputs.version }}|g" {} \;

      - name: Deploy to Kubernetes
        run: |
          # Apply configurations in order
          kubectl apply -f deployments/kubernetes/configmaps/ -n uvai-${{ needs.validate.outputs.environment }} || true
          kubectl apply -f deployments/kubernetes/secrets/ -n uvai-${{ needs.validate.outputs.environment }} || true
          kubectl apply -f deployments/kubernetes/manifests/ -n uvai-${{ needs.validate.outputs.environment }}

      - name: Wait for rollout
        run: |
          echo "Waiting for deployment rollout..."
          kubectl rollout status deployment/uvai-api -n uvai-${{ needs.validate.outputs.environment }} --timeout=600s

          # Check pod status
          kubectl get pods -n uvai-${{ needs.validate.outputs.environment }}
          kubectl get services -n uvai-${{ needs.validate.outputs.environment }}

  # Post-deployment Tests
  post-deploy-tests:
    runs-on: ubuntu-latest
    needs: [deploy-application]
    environment: ${{ needs.validate.outputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure Kubernetes
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Run smoke tests
        run: |
          # Get service endpoint
          if kubectl get svc uvai-api -n uvai-${{ needs.validate.outputs.environment }} &>/dev/null; then
            SERVICE_TYPE=$(kubectl get svc uvai-api -n uvai-${{ needs.validate.outputs.environment }} -o jsonpath='{.spec.type}')

            if [ "$SERVICE_TYPE" = "LoadBalancer" ]; then
              # Wait for LoadBalancer to get an external IP
              echo "Waiting for LoadBalancer IP..."
              for i in {1..30}; do
                EXTERNAL_IP=$(kubectl get svc uvai-api -n uvai-${{ needs.validate.outputs.environment }} -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
                if [ -n "$EXTERNAL_IP" ]; then
                  break
                fi
                sleep 10
              done

              if [ -z "$EXTERNAL_IP" ]; then
                EXTERNAL_IP=$(kubectl get svc uvai-api -n uvai-${{ needs.validate.outputs.environment }} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
              fi

              echo "Service endpoint: $EXTERNAL_IP"

              # Test health endpoint
              if curl -f -m 30 "http://$EXTERNAL_IP/health"; then
                echo "✅ Health check passed"
              else
                echo "❌ Health check failed"
                exit 1
              fi
            else
              echo "Service type is $SERVICE_TYPE, skipping external health check"
            fi
          else
            echo "⚠️  uvai-api service not found, checking pod health..."
            # Check if pods are running
            kubectl get pods -n uvai-${{ needs.validate.outputs.environment }} -l app=uvai-api
          fi

      - name: Run API endpoint tests
        run: |
          # Get service URL
          if kubectl get svc uvai-api -n uvai-${{ needs.validate.outputs.environment }} &>/dev/null; then
            SERVICE_TYPE=$(kubectl get svc uvai-api -n uvai-${{ needs.validate.outputs.environment }} -o jsonpath='{.spec.type}')

            if [ "$SERVICE_TYPE" = "LoadBalancer" ]; then
              EXTERNAL_IP=$(kubectl get svc uvai-api -n uvai-${{ needs.validate.outputs.environment }} -o jsonpath='{.status.loadBalancer.ingress[0].ip}' || kubectl get svc uvai-api -n uvai-${{ needs.validate.outputs.environment }} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

              # Test API endpoints
              echo "Testing API endpoints..."
              curl -f -m 30 "http://$EXTERNAL_IP/api/v1/status" || echo "⚠️  Status endpoint not available"
              curl -f -m 30 "http://$EXTERNAL_IP/docs/" || echo "⚠️  Docs endpoint not available"
            fi
          fi

  # Update Documentation
  update-docs:
    runs-on: ubuntu-latest
    needs: [post-deploy-tests]
    if: success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Update deployment documentation
        run: |
          # Update deployment status in documentation
          echo "# Deployment Status" > deployment-status.md
          echo "" >> deployment-status.md
          echo "## ${{ needs.validate.outputs.environment }} Environment" >> deployment-status.md
          echo "" >> deployment-status.md
          echo "- **Version**: ${{ needs.validate.outputs.version }}" >> deployment-status.md
          echo "- **Deployed at**: $(date -u)" >> deployment-status.md
          echo "- **Status**: ✅ Successfully deployed" >> deployment-status.md
          echo "- **Commit**: ${{ github.sha }}" >> deployment-status.md

          # Get pod information
          echo "" >> deployment-status.md
          echo "## Pod Status" >> deployment-status.md
          echo "\`\`\`" >> deployment-status.md
          kubectl get pods -n uvai-${{ needs.validate.outputs.environment }} -l app=uvai-api -o wide >> deployment-status.md 2>/dev/null || echo "Unable to get pod status" >> deployment-status.md
          echo "\`\`\`" >> deployment-status.md

      - name: Upload deployment status
        uses: actions/upload-artifact@v7
        with:
          name: deployment-status
          path: deployment-status.md

  # Notification
  notify:
    runs-on: ubuntu-latest
    needs: [post-deploy-tests, update-docs]
    if: always()
    steps:
      - name: Send deployment notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: "Deployment to ${{ needs.validate.outputs.environment }} completed"
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: always()

  # Rollback on Failure
  rollback:
    runs-on: ubuntu-latest
    needs: [deploy-application]
    if: failure() && needs.validate.outputs.environment == 'production'
    steps:
      - name: Configure Kubernetes
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Rollback deployment
        run: |
          echo "🚨 Deployment failed, initiating rollback..."
          kubectl rollout undo deployment/uvai-api -n uvai-${{ needs.validate.outputs.environment }}

      - name: Send rollback notification
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: "🚨 Deployment failed and rollback initiated for ${{ needs.validate.outputs.environment }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
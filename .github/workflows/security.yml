name: Security Scan

on:
  push:
    branches: [main]
  # No base-branch filter — see the note in ci.yml. A stacked PR must not be
  # able to skip the security scan by targeting a branch other than main.
  pull_request:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

permissions:
  contents: read
  pull-requests: read
  security-events: write
  actions: read


# Supersede superseded work instead of stacking it. Without this, every push
# to a PR branch queued a brand-new full run alongside the ones it obsoleted;
# with ~30 workflows and dozens of open PRs the Actions queue could not drain.
#
# PR runs are keyed by PR number and cancel their predecessors -- that is where
# all the queue pressure comes from, since every `push:` trigger here is already
# filtered to main. Non-PR runs (push, schedule) are keyed by commit SHA so they
# land in singleton groups: keying them on github.ref would collide every merge
# to main into one group, and GitHub cancels the *pending* run in a group, so a
# burst of merges would silently drop the middle commits' verdicts.
concurrency:
  group: security-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Prevent long-running jobs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install --legacy-peer-deps
      - run: npm audit --audit-level=high
        continue-on-error: true
      - name: Upload audit report
        if: always()
        run: npm audit --json > npm-audit-report.json || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: npm-audit-report
          path: npm-audit-report.json

  python-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Prevent long-running jobs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install safety
      - run: safety scan --output json > safety-report.json || true
        continue-on-error: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: safety-report
          path: safety-report.json

  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Prevent long-running jobs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install bandit
      - run: bandit -r src -f json -o bandit-report.json || true
      - uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json

  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Prevent long-running jobs
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Cache Trivy DB
        uses: actions/cache@v6
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: |
            trivy-db-
        continue-on-error: true
      - name: Build image for scanning
        run: |
          docker build -t eventrelay:test -f Dockerfile .
          docker image inspect eventrelay:test > image-identity.json
          git rev-parse HEAD > image-source-commit.txt
      # Bootstrap #2425 ships dependency repairs separately from the final
      # zero-HIGH/CRITICAL gate. Findings remain unresolved in #2396; success
      # here proves scan completion, not an accepted baseline or a clean image.
      - name: Report Trivy vulnerabilities (enforcement deferred)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'eventrelay:test'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          ignore-unfixed: false
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true
          trivyignores: '.github/trivy-no-exceptions.txt'
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'
      - name: Generate human-readable report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: always()
        with:
          image-ref: 'eventrelay:test'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: false
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.github/trivy-no-exceptions.txt'
      - name: Retain exact image scan evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-image-evidence
          path: |
            trivy-results.sarif
            image-identity.json
            image-source-commit.txt
          if-no-files-found: error

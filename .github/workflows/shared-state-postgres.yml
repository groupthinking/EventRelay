name: Shared-state PostgreSQL acceptance

on:
  pull_request:
    paths:
      - "src/youtube_extension/services/shared_sql_state.py"
      - "apps/web/supabase/migrations/**"
      - "scripts/testing/verify_shared_state_postgres.py"
      - "tests/unit/test_shared_sql_state.py"
      - ".github/workflows/shared-state-postgres.yml"

permissions:
  contents: read

concurrency:
  group: shared-state-postgres-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install bounded acceptance dependencies
        run: >-
          python -m pip install
          pgserver==0.1.4 SQLAlchemy==2.1.8 'psycopg[binary]==3.3.9'
          pydantic==2.14.3 aiohttp==3.14.5 requests==2.34.2 redis==8.1.0
      - name: Verify temporary PostgreSQL hardening and persistence
        env:
          PYTHONPATH: src
          DATABASE_URL: ""
          EVENTRELAY_SHARED_STATE_DATABASE_URL: ""
        run: python scripts/testing/verify_shared_state_postgres.py

name: Issue Triage
on:
  issues:
    types: [opened]
  # The `opened` handler below only catches shells created after it shipped
  # (2026-08-29). Empty bot-opened issues from before then -- and any that slip
  # through a failed run -- stay open forever, so sweep them on a schedule too.
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  issues: write

# Supersede superseded work instead of stacking it. Without this, every push
# to a PR branch queued a brand-new full run alongside the ones it obsoleted;
# with ~30 workflows and dozens of open PRs the Actions queue could not drain.
#
# PR runs are keyed by PR number and cancel their predecessors -- that is where
# all the queue pressure comes from, since every `push:` trigger here is already
# filtered to main. Non-PR runs (push, schedule) are keyed by commit SHA so they
# land in singleton groups: keying them on github.ref would collide every merge
# to main into one group, and GitHub cancels the *pending* run in a group, so a
# burst of merges would silently drop the middle commits' verdicts.
concurrency:
  group: issue-triage-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  triage:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            const body = (issue.body || '').trim();

            // Bot-opened issues with no body are agent-session artifacts (e.g. the
            // recurring empty "Addressing Issues" shells from Jules/Linear sessions,
            // #1548/#1553/#1568). Labeling them for triage just manufactures noise
            // that syncs back into Linear, so close them instead.
            if (issue.user && issue.user.type === 'Bot' && body === '') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '🤖 Closing automatically: this issue was opened by a bot with no description. If it tracks real work, reopen it and add a description of the problem or task.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'not_planned'
              });
              return;
            }

            const labels = [];
            const text = `${issue.title} ${body}`.toLowerCase();

            if (text.includes('bug') || text.includes('error')) labels.push('bug');
            if (text.includes('feature') || text.includes('enhancement')) labels.push('enhancement');
            if (text.includes('docs') || text.includes('documentation')) labels.push('documentation');
            if (text.includes('question') || text.includes('help')) labels.push('question');
            if (text.includes('urgent') || text.includes('critical')) labels.push('priority:high');

            labels.push('needs-triage');

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: labels
              });
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: '👋 Thanks for opening this issue! It has been automatically labeled for triage.'
            });

  # Backfill for the auto-close above: close open bot-opened issues with no
  # body that predate it or slipped past a failed run. Same criteria and same
  # comment as the `opened` handler so the two paths stay interchangeable.
  sweep-empty-bot-issues:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            for (const issue of issues) {
              if (issue.pull_request) continue;
              const body = (issue.body || '').trim();
              if (!issue.user || issue.user.type !== 'Bot' || body !== '') continue;

              core.info(`Closing empty bot-opened issue #${issue.number} (${issue.title})`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '🤖 Closing automatically: this issue was opened by a bot with no description. If it tracks real work, reopen it and add a description of the problem or task.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'not_planned'
              });
            }

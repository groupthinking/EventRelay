name: Vision-Reasoning Stack

on:
    push:
        paths:
            - "mcp-servers/shared-state/**"
            - ".github/workflows/vision-reasoning.yml"
    pull_request:
        branches: [main]
        paths:
            - "mcp-servers/shared-state/**"

env:
    PYTHON_VERSION: "3.11"

jobs:
    lint-and-type-check:
        name: Lint & Type Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: "pip"

            - name: Install dependencies
              run: |
                  pip install ruff mypy
                  pip install -r mcp-servers/requirements.txt || true

            - name: Run Ruff linter
              run: ruff check mcp-servers/shared-state/
              continue-on-error: true

            - name: Run type checking
              run: mypy mcp-servers/shared-state/*.py --ignore-missing-imports
              continue-on-error: true

    test-vision-stack:
        name: Vision Stack Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: "pip"

            - name: Install dependencies
              run: |
                  pip install pytest pytest-asyncio cryptography
                  pip install -r mcp-servers/requirements.txt || true

            - name: Test QuantomCode Signer
              run: |
                  cd mcp-servers/shared-state
                  python quantomcode_signer.py

            - name: Test Hybrid Cache
              run: |
                  cd mcp-servers/shared-state
                  python hybrid_cache.py

            - name: Test Vision Processor
              run: |
                  cd mcp-servers/shared-state
                  python vision_processor.py

    verify-signatures:
        name: Verify QuantomCode Signatures
        runs-on: ubuntu-latest
        needs: test-vision-stack
        steps:
            - uses: actions/checkout@v7

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Install cryptography
              run: pip install cryptography

            - name: Verify public key exists
              run: |
                  if [ -f "quantomcode_public.pem" ]; then
                    echo "✅ Public key found"
                    openssl ec -pubin -in quantomcode_public.pem -text -noout 2>/dev/null || true
                  else
                    echo "⚠️ Public key not found (expected for security)"
                  fi

            - name: Verify private key NOT in repo
              run: |
                  if [ -f "quantomcode_private.pem" ]; then
                    echo "❌ SECURITY WARNING: Private key should not be in repo!"
                    exit 1
                  else
                    echo "✅ Private key correctly excluded from repo"
                  fi

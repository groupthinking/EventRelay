name: 🔍 Dependency Review

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          # GHSA-w5hq-g745-h8pq: transitive uuid@8.3.2 pulled by next-auth@4.24 (which pins uuid ^8.3.2).
          # The moderate advisory affects uuid v3/v5/v6 when a caller-provided buffer is passed; next-auth
          # only calls v4(), so the vulnerable code path is unreachable here. The first patched uuid is
          # 11.1.1, outside next-auth's declared range. Remove this allow once next-auth bumps uuid.
          allow-ghsas: GHSA-w5hq-g745-h8pq
          # PR #295 adds Sentry (@sentry/cli FSL-1.1-MIT), vite/vitest tree (BlueOak-1.0.0,
          # MPL-2.0 lightningcss), and type-fest (CC0-1.0). All are permissive or file-level.
          allow-licenses: >-
            MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, Python-2.0,
            FSL-1.1-MIT, BlueOak-1.0.0, MPL-2.0, CC0-1.0
          comment-summary-in-pr: always
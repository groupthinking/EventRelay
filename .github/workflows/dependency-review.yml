name: 🔍 Dependency Review

on:
  push:
    branches: [main]
  # No base-branch filter — see the note in ci.yml.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write


# Supersede superseded work instead of stacking it. Without this, every push
# to a PR branch queued a brand-new full run alongside the ones it obsoleted;
# with ~30 workflows and dozens of open PRs the Actions queue could not drain.
#
# PR runs are keyed by PR number and cancel their predecessors -- that is where
# all the queue pressure comes from, since every `push:` trigger here is already
# filtered to main. Non-PR runs (push, schedule) are keyed by commit SHA so they
# land in singleton groups: keying them on github.ref would collide every merge
# to main into one group, and GitHub cancels the *pending* run in a group, so a
# burst of merges would silently drop the middle commits' verdicts.
concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 30  # Allow full-tree scan, scoped lock submissions, and base/head snapshot retry
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          # PR runs inspect changes introduced after the shared ancestor.
          # A dependency update merged into main after this PR branched must
          # not turn a source-only PR into a dependency-review run.
          fetch-depth: 0
          persist-credentials: false

      - name: Detect dependency manifest changes
        id: dependency-changes
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import PurePosixPath
          import subprocess

          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]
          merge_base = subprocess.run(
              ["git", "merge-base", base, head],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          output = subprocess.run(
              ["git", "diff", "--name-only", "-z", merge_base, head],
              check=True,
              capture_output=True,
          ).stdout
          paths = [PurePosixPath(raw.decode("utf-8")) for raw in output.split(b"\0") if raw]
          exact_names = {
              "Cargo.lock", "Cargo.toml", "Directory.Build.props",
              "Directory.Build.targets", "Directory.Packages.props",
              "Gemfile", "Gemfile.lock", "NuGet.Config", "Package.resolved",
              "Package.swift", "Pipfile", "Pipfile.lock", "bun.lock",
              "bun.lockb", "bunfig.toml", "composer.json", "composer.lock",
              "conda-lock.yml", "deno.json", "deno.jsonc", "deno.lock",
              "environment.yaml", "environment.yml", "global.json", "go.mod",
              "go.sum", "gradle.properties", "mix.exs", "mix.lock",
              "npm-shrinkwrap.json", "package-lock.json", "package.json",
              "packages.lock.json", "pixi.lock", "pixi.toml", "pnpm-lock.yaml",
              "poetry.lock", "pom.xml", "pylock.toml", "pyproject.toml",
              "settings.gradle", "settings.gradle.kts", "setup.cfg", "setup.py",
              "stack.yaml", "stack.yaml.lock", "uv.lock", "yarn.lock",
          }

          def is_dependency_input(path: PurePosixPath) -> bool:
              # Workflow and Dependabot configuration changes are covered by
              # CI tests; they do not change the installed dependency graph.
              # The native Actions lockfile is an executable dependency input.
              name = path.name
              return (
                  name in exact_names
                  or name.startswith("Dockerfile")
                  or (
                      name.startswith(("constraints", "requirements"))
                      and name.endswith((".in", ".txt"))
                  )
                  or name.endswith((".csproj", ".fsproj", ".gradle", ".gradle.kts"))
                  or path.as_posix() in {"vendor/modules.txt", ".github/workflows/actions.lock"}
              )

          changed = sorted(path.as_posix() for path in paths if is_dependency_input(path))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"changed={'true' if changed else 'false'}\n")
              handle.write(f"count={len(changed)}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              if changed:
                  handle.write("Dependency inputs changed:\n\n")
                  handle.writelines(f"- `{path}`\n" for path in changed)
              else:
                  handle.write(
                      "No dependency inputs introduced by this PR since "
                      "its merge base.\n"
                  )
          PY

      - name: Submit dependency snapshots
        if: >-
          ${{ github.event_name == 'push' ||
              (github.event.pull_request.head.repo.full_name == github.repository &&
               steps.dependency-changes.outputs.changed == 'true') }}
        # Scan the same full tree on main and on dependency PRs so GitHub compares
        # matching snapshot sets. Bound each pip report; on a timeout, component-
        # detection falls back to declared source dependencies. A 120-second
        # bound produced base/head drift in the #2501 exact-lock canary.
        env:
          PipReportFileLevelTimeoutSeconds: "240"
        uses: advanced-security/component-detection-dependency-submission-action@a02aeda7a175ad4dd38a13c4d3ff2df9da8f2cf0 # v0.2.0
        with:
          snapshot-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          snapshot-ref: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.event.pull_request.head.ref) || github.ref }}

      - name: Submit complete lock snapshot
        if: >-
          ${{ github.event_name == 'push' ||
              (github.event.pull_request.head.repo.full_name == github.repository &&
               steps.dependency-changes.outputs.changed == 'true') }}
        env:
          SNAPSHOT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          SNAPSHOT_REF: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.event.pull_request.head.ref) || github.ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m scripts.ci.submit_npm_lock_snapshot

      - name: Dependency Review
        id: review
        if: >-
          ${{ github.event_name == 'pull_request' &&
              steps.dependency-changes.outputs.changed == 'true' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}
          fail-on-severity: moderate
          # Base and head snapshot submissions can overlap. In the exact-lock
          # canary, the base snapshots became available after the former 300-second
          # retry expired; wait for both sides before judging dependency changes.
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 600
          # GHSA-w5hq-g745-h8pq: transitive uuid@8.3.2 pulled by next-auth@4.24 (which pins uuid ^8.3.2).
          # The moderate advisory affects uuid v3/v5/v6 when a caller-provided buffer is passed; next-auth
          # only calls v4(), so the vulnerable code path is unreachable here. The first patched uuid is
          # 11.1.1, outside next-auth's declared range. Remove this allow once next-auth bumps uuid.
          allow-ghsas: GHSA-w5hq-g745-h8pq
          # PR #295: vite/vitest tree (BlueOak-1.0.0, MPL-2.0 lightningcss), type-fest (CC0-1.0),
          # rollup@4.x compound SPDX (0BSD AND ISC AND MIT).
          # Pillow 13 publishes the permissive MIT-CMU SPDX identifier; yt-dlp publishes
          # the public-domain-equivalent Unlicense identifier. Both are direct runtime
          # dependencies and are allowed explicitly here rather than excluded from review.
          # FSL-1.1-MIT is not a valid SPDX id for allow-licenses — exclude @sentry/* via purls.
          # caniuse-lite ships MIT code but a CC-BY-4.0 dataset; the scanner reports the data
          # license, which is not code we redistribute. It updates on nearly every browserslist
          # refresh, so allow it by purl rather than adding CC-BY-4.0 to the global allow-licenses.
          # Sharp's prebuilt libvips runtime packages are LGPL-3.0-or-later. Keep this exception
          # package-scoped and explicit instead of allowing LGPL globally; these binaries were
          # already present, and the patched Sharp release only refreshes their versions.
          allow-licenses: >-
            MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, Python-2.0,
            BlueOak-1.0.0, MPL-2.0, CC0-1.0, 0BSD, MIT-CMU, Unlicense
          # Docs/prototype pip deps (not shipped product code): the scanner reports regex with a
          # CNRI-Python fragment (upstream misattribution; the package is Apache-2.0) and torch with
          # a bundled BSL-1.0 component. Both live under docs/ only. Revisit if they move into
          # shipped code. Added 2026-10-02: the finding is pre-existing on main and fails every PR
          # touching any dependency manifest, including dependabot's.
          allow-dependencies-licenses: >-
            pkg:pypi/regex,
            pkg:pypi/torch,
            pkg:npm/caniuse-lite,
            pkg:npm/@sentry/nextjs,
            pkg:npm/@sentry/cli,
            pkg:npm/@sentry/cli-darwin,
            pkg:npm/@sentry/cli-linux-arm,
            pkg:npm/@sentry/cli-linux-arm64,
            pkg:npm/@sentry/cli-linux-i686,
            pkg:npm/@sentry/cli-linux-x64,
            pkg:npm/@sentry/cli-win32-arm64,
            pkg:npm/@sentry/cli-win32-i686,
            pkg:npm/@sentry/cli-win32-x64,
            pkg:npm/@sentry/bundler-plugin-core,
            pkg:npm/@sentry/babel-plugin-component-annotate,
            pkg:npm/@img/sharp-libvips-darwin-arm64,
            pkg:npm/@img/sharp-libvips-darwin-x64,
            pkg:npm/@img/sharp-libvips-linux-arm,
            pkg:npm/@img/sharp-libvips-linux-arm64,
            pkg:npm/@img/sharp-libvips-linux-ppc64,
            pkg:npm/@img/sharp-libvips-linux-riscv64,
            pkg:npm/@img/sharp-libvips-linux-s390x,
            pkg:npm/@img/sharp-libvips-linux-x64,
            pkg:npm/@img/sharp-libvips-linuxmusl-arm64,
            pkg:npm/@img/sharp-libvips-linuxmusl-x64,
            pkg:npm/@img/sharp-wasm32,
            pkg:npm/@img/sharp-win32-arm64,
            pkg:npm/@img/sharp-win32-ia32,
            pkg:npm/@img/sharp-win32-x64
          comment-summary-in-pr: always

      # Fetch the same dependency diff from GitHub's API instead of expanding
      # dependency-changes in an Actions expression. Large grouped updates can
      # exceed the runner's template-object limit before the record step starts.
      - name: Record dependency review evidence
        if: >-
          ${{ always() && github.event_name == 'pull_request' &&
              steps.dependency-changes.outputs.changed == 'true' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m scripts.ci.record_dependency_review

      - name: Upload dependency review evidence
        if: >-
          ${{ always() && github.event_name == 'pull_request' &&
              steps.dependency-changes.outputs.changed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-review-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: dependency-review-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Record no dependency delta
        if: >-
          ${{ github.event_name == 'pull_request' &&
              steps.dependency-changes.outputs.changed == 'false' }}
        run: echo "Dependency review passed without snapshot submission; the exact PR diff contains no dependency inputs."

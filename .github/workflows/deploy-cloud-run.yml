name: Deploy Cloud Run PostgreSQL substrate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment to deploy
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      commit_sha:
        description: Exact 40-character commit SHA selected in the ref picker
        required: true
        type: string

# A single repository-wide lane prevents staging and production from racing if
# their protected environments are accidentally pointed at the same project.
concurrency:
  group: cloud-run-${{ github.repository }}
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  ARTIFACT_PROJECT_ID: ${{ vars.ARTIFACT_PROJECT_ID }}
  REGION: us-central1
  ARTIFACT_REPO: eventrelay-repo
  API_SERVICE: uvai-backend
  WORKER_SERVICE: eventrelay-api-cost-worker
  MIGRATION_JOB: eventrelay-api-cost-migrate
  CLOUD_SQL_INSTANCE_CONNECTION_NAME: ${{ vars.CLOUD_SQL_INSTANCE_CONNECTION_NAME }}
  API_COST_RUNTIME_DB_ROLE: ${{ vars.API_COST_RUNTIME_DB_ROLE }}
  API_RUNTIME_SERVICE_ACCOUNT: ${{ vars.API_RUNTIME_SERVICE_ACCOUNT }}
  WORKER_RUNTIME_SERVICE_ACCOUNT: ${{ vars.WORKER_RUNTIME_SERVICE_ACCOUNT }}
  MIGRATION_SERVICE_ACCOUNT: ${{ vars.MIGRATION_SERVICE_ACCOUNT }}

jobs:
  deploy:
    name: Migrate, deploy worker, deploy API
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      actions: read
      contents: read
      checks: read
      deployments: read
      id-token: write

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Verify exact main SHA and protected configuration
        id: release_gate
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${REQUESTED_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::commit_sha must be a full lowercase 40-character SHA"
            exit 1
          }
          test "${REQUESTED_SHA}" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${REQUESTED_SHA}"

          required=(
            PROJECT_ID ARTIFACT_PROJECT_ID CLOUD_SQL_INSTANCE_CONNECTION_NAME
            API_COST_RUNTIME_DB_ROLE API_RUNTIME_SERVICE_ACCOUNT
            WORKER_RUNTIME_SERVICE_ACCOUNT MIGRATION_SERVICE_ACCOUNT
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Protected environment value ${name} is required"
              exit 1
            fi
          done

          if [[ "${API_RUNTIME_SERVICE_ACCOUNT}" == "${WORKER_RUNTIME_SERVICE_ACCOUNT}" \
             || "${API_RUNTIME_SERVICE_ACCOUNT}" == "${MIGRATION_SERVICE_ACCOUNT}" \
             || "${WORKER_RUNTIME_SERVICE_ACCOUNT}" == "${MIGRATION_SERVICE_ACCOUNT}" ]]; then
            echo "::error::API, worker, and migration service accounts must be pairwise distinct"
            exit 1
          fi

          if [[ "${DEPLOY_ENVIRONMENT}" == "production" ]]; then
            test "${GITHUB_REF}" = "refs/heads/main"
            git fetch origin main --depth=1
            test "$(git rev-parse origin/main)" = "${REQUESTED_SHA}"

            staging_deployment_json="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/deployments?sha=${REQUESTED_SHA}&environment=staging&per_page=1")"
            staging_deployment_id="$(jq -er '.[0].id' \
              <<<"${staging_deployment_json}")" || {
              echo "::error::Latest staging deployment is missing for exact SHA ${REQUESTED_SHA}"
              exit 1
            }

            staging_status_json="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/deployments/${staging_deployment_id}/statuses?per_page=1")"
            staging_state="$(jq -er '.[0].state' <<<"${staging_status_json}")"
            [[ "${staging_state}" == "success" ]] || {
              echo "::error::Latest staging deployment for ${REQUESTED_SHA} must be successful"
              exit 1
            }
            staging_log_url="$(jq -er '.[0].log_url' <<<"${staging_status_json}")"
            if [[ "${staging_log_url}" =~ /actions/runs/([0-9]+) ]]; then
              staging_run_id="${BASH_REMATCH[1]}"
            else
              echo "::error::Latest staging deployment is not traceable to a GitHub Actions run"
              exit 1
            fi

            staging_run_json="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${staging_run_id}")"
            jq -e \
              --arg sha "${REQUESTED_SHA}" \
              --arg repository "${GITHUB_REPOSITORY}" \
              '.head_sha == $sha
               and .conclusion == "success"
               and .event == "workflow_dispatch"
               and .repository.full_name == $repository
               and (.path | split("@")[0]) == ".github/workflows/deploy-cloud-run.yml"' \
              <<<"${staging_run_json}" >/dev/null || {
              echo "::error::Staging deployment run provenance does not match this workflow and exact SHA"
              exit 1
            }
            echo "staging_run_id=${staging_run_id}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Require PostgreSQL migration matrix for exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checks="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100")"
          jq -e '
            .check_runs as $runs
            | ["fresh", "from-002", "round-trip"] as $required
            | all(
                $required[];
                . as $scenario
                | any(
                    $runs[];
                    .name == ("PostgreSQL migration matrix (" + $scenario + ")")
                    and .conclusion == "success"
                  )
              )
          ' <<<"${checks}" >/dev/null || {
            echo "::error::PostgreSQL migration matrix has not succeeded for ${GITHUB_SHA}"
            exit 1
          }

      - name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Inventory existing API service and enforce identity access
        id: api_preflight
        run: |
          set -euo pipefail
          service_json="$(gcloud run services describe "${API_SERVICE}" \
            --project="${PROJECT_ID}" --region="${REGION}" --format=json)"

          mapfile -t serving_revisions < <(jq -r \
            '.status.traffic[] | select(.percent == 100) | .revisionName // empty' \
            <<<"${service_json}")
          [[ "${#serving_revisions[@]}" -eq 1 ]] || {
            echo "::error::API must have exactly one explicitly named revision serving 100 percent before rollout"
            exit 1
          }
          previous_revision="${serving_revisions[0]}"
          latest_created="$(jq -er '.status.latestCreatedRevisionName' \
            <<<"${service_json}")"
          latest_ready="$(jq -er '.status.latestReadyRevisionName' \
            <<<"${service_json}")"
          if [[ "${latest_created}" != "${previous_revision}" \
             || "${latest_ready}" != "${previous_revision}" ]]; then
            echo "::error::Latest-created and latest-ready revisions must equal the sole 100-percent serving revision"
            exit 1
          fi
          if jq -e 'any(.status.traffic[]?; (.tag // "") != "")' \
            <<<"${service_json}" >/dev/null; then
            echo "::error::Pre-existing Cloud Run traffic tags are forbidden; review and remove them before rollout"
            exit 1
          fi

          serving_revision_json="$(gcloud run revisions describe \
            "${previous_revision}" --project="${PROJECT_ID}" \
            --region="${REGION}" --format=json)"
          current_service_account="$(jq -er '.spec.serviceAccountName' \
            <<<"${serving_revision_json}")"
          test "${current_service_account}" = "${API_RUNTIME_SERVICE_ACCOUNT}" || {
            echo "::error::API_RUNTIME_SERVICE_ACCOUNT must equal the serving API identity; this rollout will not replace it"
            exit 1
          }
          previous_cloudsql="$(jq -c '
            (.metadata.annotations["run.googleapis.com/cloudsql-instances"] // "")
            | split(",") | map(select(length > 0)) | sort | unique
          ' <<<"${serving_revision_json}")"
          if jq -e '
            any(.spec.containers[]?.env[]?; .name == "API_COST_WEBHOOK_URL")
          ' <<<"${serving_revision_json}" >/dev/null; then
            echo "::error::Serving revision still mounts API_COST_WEBHOOK_URL; remove it before substrate rollout"
            exit 1
          fi

          assert_direct_secret_accessor() {
            local account="$1"
            local secret="$2"
            local policy
            policy="$(gcloud secrets get-iam-policy "${secret}" \
              --project="${PROJECT_ID}" --format=json)"
            jq -e --arg member "serviceAccount:${account}" '
              any(
                .bindings[]?;
                .role == "roles/secretmanager.secretAccessor"
                and any(.members[]?; . == $member)
              )
            ' <<<"${policy}" >/dev/null || {
              echo "::error::${account} needs a direct accessor binding on ${secret}"
              exit 1
            }
          }

          assert_no_direct_secret_accessor() {
            local account="$1"
            local secret="$2"
            local policy
            policy="$(gcloud secrets get-iam-policy "${secret}" \
              --project="${PROJECT_ID}" --format=json)"
            if jq -e --arg member "serviceAccount:${account}" '
              any(
                .bindings[]?;
                .role == "roles/secretmanager.secretAccessor"
                and any(.members[]?; . == $member)
              )
            ' <<<"${policy}" >/dev/null; then
              echo "::error::${account} must not have direct accessor binding on ${secret}"
              exit 1
            fi
          }

          assert_direct_secret_accessor \
            "${MIGRATION_SERVICE_ACCOUNT}" EVENTRELAY_DATABASE_URL_DDL
          assert_direct_secret_accessor \
            "${WORKER_RUNTIME_SERVICE_ACCOUNT}" EVENTRELAY_DATABASE_URL_DML
          for secret in EVENTRELAY_DATABASE_URL_DML GEMINI_API_KEY \
            OPENAI_API_KEY YOUTUBE_API_KEY EVENTRELAY_API_KEY; do
            assert_direct_secret_accessor "${current_service_account}" "${secret}"
          done

          assert_no_direct_secret_accessor \
            "${current_service_account}" EVENTRELAY_DATABASE_URL_DDL
          assert_no_direct_secret_accessor \
            "${WORKER_RUNTIME_SERVICE_ACCOUNT}" EVENTRELAY_DATABASE_URL_DDL
          assert_no_direct_secret_accessor \
            "${MIGRATION_SERVICE_ACCOUNT}" EVENTRELAY_DATABASE_URL_DML
          for secret in GEMINI_API_KEY OPENAI_API_KEY YOUTUBE_API_KEY \
            EVENTRELAY_API_KEY; do
            assert_no_direct_secret_accessor \
              "${WORKER_RUNTIME_SERVICE_ACCOUNT}" "${secret}"
            assert_no_direct_secret_accessor \
              "${MIGRATION_SERVICE_ACCOUNT}" "${secret}"
          done

          project_policy="$(gcloud projects get-iam-policy "${PROJECT_ID}" --format=json)"
          for account in "${current_service_account}" \
            "${WORKER_RUNTIME_SERVICE_ACCOUNT}" "${MIGRATION_SERVICE_ACCOUNT}"; do
            if jq -e --arg member "serviceAccount:${account}" '
              any(
                .bindings[]?;
                .role == "roles/secretmanager.secretAccessor"
                and any(.members[]?; . == $member)
              )
            ' <<<"${project_policy}" >/dev/null; then
              echo "::error::Remove project-wide Secret Manager accessor from ${account}; use per-secret bindings"
              exit 1
            fi
          done

          echo "current_service_account=${current_service_account}" >> "${GITHUB_OUTPUT}"
          echo "previous_revision=${previous_revision}" >> "${GITHUB_OUTPUT}"
          echo "previous_cloudsql=${previous_cloudsql}" >> "${GITHUB_OUTPUT}"

      - name: Verify known-good rollback target before mutation
        run: |
          set -euo pipefail
          previous_revision="${{ steps.api_preflight.outputs.previous_revision }}"
          service_json="$(gcloud run services describe "${API_SERVICE}" \
            --project="${PROJECT_ID}" --region="${REGION}" --format=json)"
          jq -e --arg revision "${previous_revision}" '
            [.status.traffic[]? | select(.percent == 100)] as $serving
            | ($serving | length) == 1
              and $serving[0].revisionName == $revision
          ' <<<"${service_json}" >/dev/null || {
            echo "::error::Rollback target changed after preflight"
            exit 1
          }
          service_url="$(jq -er '.status.url' <<<"${service_json}")"
          for attempt in $(seq 1 6); do
            if curl --fail --silent --show-error \
              --connect-timeout 5 --max-time 15 \
              "${service_url}/api/v1/health" >/dev/null; then
              exit 0
            fi
            echo "rollback-target health attempt ${attempt}/6 failed"
            sleep 5
          done
          echo "::error::Current rollback target is not healthy"
          exit 1

      - name: Resolve numeric secret versions
        id: secret_versions
        run: |
          set -euo pipefail
          resolve_version() {
            local output_key="$1"
            local secret_name="$2"
            local version
            version="$(gcloud secrets versions list "${secret_name}" \
              --project="${PROJECT_ID}" \
              --filter='state=ENABLED' \
              --sort-by='~createTime' \
              --limit=1 \
              --format='value(name)')"
            [[ "${version}" =~ ^[0-9]+$ ]] || {
              echo "::error::No enabled numeric version found for ${secret_name}"
              exit 1
            }
            echo "${output_key}=${version}" >> "${GITHUB_OUTPUT}"
          }

          resolve_version database_ddl EVENTRELAY_DATABASE_URL_DDL
          resolve_version database_dml EVENTRELAY_DATABASE_URL_DML
          resolve_version gemini GEMINI_API_KEY
          resolve_version openai OPENAI_API_KEY
          resolve_version youtube YOUTUBE_API_KEY
          resolve_version eventrelay EVENTRELAY_API_KEY

      - name: Configure Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push staged immutable image
        id: staged_image
        if: ${{ inputs.environment == 'staging' }}
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${ARTIFACT_PROJECT_ID}/${ARTIFACT_REPO}/uvai-backend:${GITHUB_SHA}"
          docker build --pull --file Dockerfile --tag "${IMAGE}" .
          docker push "${IMAGE}"
          DIGEST="$(gcloud artifacts docker images describe "${IMAGE}" \
            --project="${ARTIFACT_PROJECT_ID}" \
            --format='value(image_summary.digest)')"
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::Artifact Registry did not return an immutable digest"
            exit 1
          }
          IMMUTABLE_IMAGE="${IMAGE}@${DIGEST}"
          echo "tag=${IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "uri=${IMMUTABLE_IMAGE}" >> "${GITHUB_OUTPUT}"
          manifest_dir="${RUNNER_TEMP}/api-cost-staging-image"
          mkdir -p "${manifest_dir}"
          jq -n \
            --arg commit_sha "${GITHUB_SHA}" \
            --arg tag "${IMAGE}" \
            --arg digest "${DIGEST}" \
            --arg uri "${IMMUTABLE_IMAGE}" \
            '{commit_sha: $commit_sha, tag: $tag, digest: $digest, uri: $uri}' \
            > "${manifest_dir}/manifest.json"

      - name: Upload staged image manifest
        if: ${{ inputs.environment == 'staging' }}
        uses: actions/upload-artifact@v7
        with:
          name: api-cost-staging-${{ github.sha }}
          path: ${{ runner.temp }}/api-cost-staging-image/manifest.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Download exact staged image manifest
        if: ${{ inputs.environment == 'production' }}
        uses: actions/download-artifact@v8
        with:
          name: api-cost-staging-${{ github.sha }}
          path: ${{ runner.temp }}/api-cost-staging-image
          repository: ${{ github.repository }}
          run-id: ${{ steps.release_gate.outputs.staging_run_id }}
          github-token: ${{ github.token }}

      - name: Validate exact staged image
        id: production_image
        if: ${{ inputs.environment == 'production' }}
        run: |
          set -euo pipefail
          manifest="${RUNNER_TEMP}/api-cost-staging-image/manifest.json"
          test -f "${manifest}"
          expected_tag="${REGION}-docker.pkg.dev/${ARTIFACT_PROJECT_ID}/${ARTIFACT_REPO}/uvai-backend:${GITHUB_SHA}"
          jq -e \
            --arg commit_sha "${GITHUB_SHA}" \
            --arg tag "${expected_tag}" '
              .commit_sha == $commit_sha
              and .tag == $tag
              and (.digest | test("^sha256:[0-9a-f]{64}$"))
              and .uri == (.tag + "@" + .digest)
            ' "${manifest}" >/dev/null
          TAG="$(jq -er '.tag' "${manifest}")"
          DIGEST="$(jq -er '.digest' "${manifest}")"
          IMMUTABLE_IMAGE="$(jq -er '.uri' "${manifest}")"
          registry_digest="$(gcloud artifacts docker images describe \
            "${IMMUTABLE_IMAGE}" --project="${ARTIFACT_PROJECT_ID}" \
            --format='value(image_summary.digest)')"
          test "${registry_digest}" = "${DIGEST}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "uri=${IMMUTABLE_IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Select immutable image
        id: image
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          STAGED_TAG: ${{ steps.staged_image.outputs.tag }}
          STAGED_DIGEST: ${{ steps.staged_image.outputs.digest }}
          STAGED_URI: ${{ steps.staged_image.outputs.uri }}
          PRODUCTION_TAG: ${{ steps.production_image.outputs.tag }}
          PRODUCTION_DIGEST: ${{ steps.production_image.outputs.digest }}
          PRODUCTION_URI: ${{ steps.production_image.outputs.uri }}
        run: |
          set -euo pipefail
          if [[ "${DEPLOY_ENVIRONMENT}" == "staging" ]]; then
            TAG="${STAGED_TAG}"
            DIGEST="${STAGED_DIGEST}"
            URI="${STAGED_URI}"
          else
            TAG="${PRODUCTION_TAG}"
            DIGEST="${PRODUCTION_DIGEST}"
            URI="${PRODUCTION_URI}"
          fi
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "${URI}" = "${TAG}@${DIGEST}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "uri=${URI}" >> "${GITHUB_OUTPUT}"

      - name: Deploy migration and grant-reconciliation job
        run: |
          set -euo pipefail
          gcloud run jobs deploy "${MIGRATION_JOB}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${{ steps.image.outputs.uri }}" \
            --service-account="${MIGRATION_SERVICE_ACCOUNT}" \
            --command=python \
            --args=-m,youtube_extension.backend.api_cost_migrate \
            --set-cloudsql-instances="${CLOUD_SQL_INSTANCE_CONNECTION_NAME}" \
            --set-env-vars="ENVIRONMENT=${{ inputs.environment }},PYTHONPATH=/app/src,CLOUD_SQL_INSTANCE_CONNECTION_NAME=${CLOUD_SQL_INSTANCE_CONNECTION_NAME},API_COST_RUNTIME_DB_ROLE=${API_COST_RUNTIME_DB_ROLE}" \
            --set-secrets="DATABASE_URL=EVENTRELAY_DATABASE_URL_DDL:${{ steps.secret_versions.outputs.database_ddl }}" \
            --tasks=1 \
            --parallelism=1 \
            --max-retries=0 \
            --task-timeout=10m \
            --quiet

      - name: Execute migrations before either runtime
        id: migration_execution_primary
        run: |
          set -euo pipefail
          execution="$(gcloud run jobs execute "${MIGRATION_JOB}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --wait \
            --format='value(metadata.name)')"
          [[ -n "${execution}" ]]
          echo "execution=${execution}" >> "${GITHUB_OUTPUT}"

      - name: Reconcile migrations a second time in staging
        id: migration_execution_reconcile
        if: ${{ inputs.environment == 'staging' }}
        run: |
          set -euo pipefail
          execution="$(gcloud run jobs execute "${MIGRATION_JOB}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --wait \
            --format='value(metadata.name)')"
          [[ -n "${execution}" ]]
          echo "execution=${execution}" >> "${GITHUB_OUTPUT}"

      - name: Deploy disabled dedicated worker
        id: worker
        run: |
          set -euo pipefail
          gcloud run deploy "${WORKER_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${{ steps.image.outputs.uri }}" \
            --service-account="${WORKER_RUNTIME_SERVICE_ACCOUNT}" \
            --command=python \
            --args=-m,youtube_extension.backend.api_cost_worker \
            --set-cloudsql-instances="${CLOUD_SQL_INSTANCE_CONNECTION_NAME}" \
            --set-env-vars="ENVIRONMENT=${{ inputs.environment }},PYTHONPATH=/app/src,CLOUD_SQL_INSTANCE_CONNECTION_NAME=${CLOUD_SQL_INSTANCE_CONNECTION_NAME},API_COST_RUNTIME_DB_ROLE=${API_COST_RUNTIME_DB_ROLE},API_COST_TRACKING=true,API_COST_DELIVERY_ENABLED=false,API_COST_WORKER_BATCH_SIZE=10" \
            --set-secrets="API_COST_DATABASE_URL=EVENTRELAY_DATABASE_URL_DML:${{ steps.secret_versions.outputs.database_dml }}" \
            --memory=512Mi \
            --cpu=1 \
            --min=1 \
            --max=1 \
            --concurrency=1 \
            --no-cpu-throttling \
            --no-allow-unauthenticated \
            --port=8080 \
            --startup-probe=httpGet.path=/readyz,httpGet.port=8080,periodSeconds=5,timeoutSeconds=5,failureThreshold=24 \
            --readiness-probe=httpGet.path=/readyz,httpGet.port=8080,periodSeconds=5,timeoutSeconds=5,failureThreshold=3,successThreshold=1 \
            --liveness-probe=httpGet.path=/healthz,httpGet.port=8080,periodSeconds=15,timeoutSeconds=5,failureThreshold=3 \
            --quiet

          worker_json="$(gcloud run services describe "${WORKER_SERVICE}" \
            --project="${PROJECT_ID}" --region="${REGION}" --format=json)"
          worker_revision="$(jq -er '.status.latestReadyRevisionName' \
            <<<"${worker_json}")"
          worker_image="$(gcloud run revisions describe "${worker_revision}" \
            --project="${PROJECT_ID}" --region="${REGION}" \
            --format='value(spec.containers[0].image)')"
          test "${worker_image##*@}" = "${{ steps.image.outputs.digest }}"
          echo "revision=${worker_revision}" >> "${GITHUB_OUTPUT}"

      - name: Deploy API candidate without traffic
        id: api_candidate
        env:
          PREVIOUS_CLOUDSQL: ${{ steps.api_preflight.outputs.previous_cloudsql }}
        run: |
          set -euo pipefail
          TAG="candidate-${GITHUB_SHA:0:12}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          gcloud run deploy "${API_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${{ steps.image.outputs.uri }}" \
            --add-cloudsql-instances="${CLOUD_SQL_INSTANCE_CONNECTION_NAME}" \
            --update-env-vars="ENVIRONMENT=${{ inputs.environment }},DEBUG=false,LOG_LEVEL=INFO,PYTHONPATH=/app/src,CLOUD_SQL_INSTANCE_CONNECTION_NAME=${CLOUD_SQL_INSTANCE_CONNECTION_NAME},API_COST_RUNTIME_DB_ROLE=${API_COST_RUNTIME_DB_ROLE},API_COST_TRACKING=true,API_COST_DELIVERY_ENABLED=false" \
            --remove-env-vars=API_COST_MONITOR_DB_PATH,API_COST_WEBHOOK_URL \
            --update-secrets="API_COST_DATABASE_URL=EVENTRELAY_DATABASE_URL_DML:${{ steps.secret_versions.outputs.database_dml }},GEMINI_API_KEY=GEMINI_API_KEY:${{ steps.secret_versions.outputs.gemini }},OPENAI_API_KEY=OPENAI_API_KEY:${{ steps.secret_versions.outputs.openai }},YOUTUBE_API_KEY=YOUTUBE_API_KEY:${{ steps.secret_versions.outputs.youtube }},EVENTRELAY_API_KEY=EVENTRELAY_API_KEY:${{ steps.secret_versions.outputs.eventrelay }}" \
            --remove-secrets=API_COST_WEBHOOK_URL \
            --memory=2Gi \
            --cpu=2 \
            --timeout=300 \
            --concurrency=80 \
            --min=1 \
            --max=10 \
            --allow-unauthenticated \
            --port=8080 \
            --no-traffic \
            --tag="${TAG}" \
            --startup-probe=httpGet.path=/readyz,httpGet.port=8080,periodSeconds=5,timeoutSeconds=5,failureThreshold=24 \
            --readiness-probe=httpGet.path=/readyz,httpGet.port=8080,periodSeconds=5,timeoutSeconds=5,failureThreshold=3,successThreshold=1 \
            --liveness-probe=httpGet.path=/health,httpGet.port=8080,periodSeconds=30,timeoutSeconds=5,failureThreshold=3 \
            --quiet

          service_json="$(gcloud run services describe "${API_SERVICE}" \
            --project="${PROJECT_ID}" --region="${REGION}" --format=json)"
          current_service_account="$(jq -er \
            '.spec.template.spec.serviceAccountName' <<<"${service_json}")"
          test "${current_service_account}" = \
            "${{ steps.api_preflight.outputs.current_service_account }}"
          candidate_cloudsql="$(jq -c '
            (.spec.template.metadata.annotations["run.googleapis.com/cloudsql-instances"] // "")
            | split(",") | map(select(length > 0)) | sort | unique
          ' <<<"${service_json}")"
          while IFS= read -r instance; do
            [[ -n "${instance}" ]] || continue
            jq -e --arg instance "${instance}" \
              'any(.[]; . == $instance)' <<<"${candidate_cloudsql}" >/dev/null || {
              echo "::error::Candidate lost an existing Cloud SQL attachment: ${instance}"
              exit 1
            }
          done < <(jq -r '.[]' <<<"${PREVIOUS_CLOUDSQL}")
          jq -e --arg instance "${CLOUD_SQL_INSTANCE_CONNECTION_NAME}" \
            'any(.[]; . == $instance)' <<<"${candidate_cloudsql}" >/dev/null
          revision="$(jq -r '.status.latestReadyRevisionName' <<<"${service_json}")"
          candidate_url="$(jq -r --arg tag "${TAG}" \
            '.status.traffic[] | select(.tag == $tag) | .url' <<<"${service_json}")"
          test -n "${revision}"
          test -n "${candidate_url}"
          revision_image="$(gcloud run revisions describe "${revision}" \
            --project="${PROJECT_ID}" --region="${REGION}" \
            --format='value(spec.containers[0].image)')"
          test "${revision_image##*@}" = "${{ steps.image.outputs.digest }}"
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"
          echo "candidate_url=${candidate_url}" >> "${GITHUB_OUTPUT}"

      - name: Smoke candidate readiness
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
              "${{ steps.api_candidate.outputs.candidate_url }}/readyz" >/dev/null; then
              curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
                "${{ steps.api_candidate.outputs.candidate_url }}/api/v1/health" \
                >/dev/null && exit 0
            fi
            echo "candidate readiness attempt ${attempt}/24 failed"
            sleep 5
          done
          echo "::error::Candidate revision never became database-ready"
          exit 1

      - name: Remove candidate tag before promotion
        run: |
          set -euo pipefail
          gcloud run services update-traffic "${API_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --remove-tags="${{ steps.api_candidate.outputs.tag }}" \
            --quiet
          service_json="$(gcloud run services describe "${API_SERVICE}" \
            --project="${PROJECT_ID}" --region="${REGION}" --format=json)"
          jq -e --arg tag "${{ steps.api_candidate.outputs.tag }}" '
            all(.status.traffic[]?; .tag != $tag)
          ' <<<"${service_json}" >/dev/null

      - name: Promote API traffic and verify serving revision
        id: promote
        run: |
          set -euo pipefail
          gcloud run services update-traffic "${API_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --to-revisions="${{ steps.api_candidate.outputs.revision }}=100" \
            --quiet

          service_json="$(gcloud run services describe "${API_SERVICE}" \
            --project="${PROJECT_ID}" --region="${REGION}" --format=json)"
          jq -e --arg revision "${{ steps.api_candidate.outputs.revision }}" '
            .status.traffic
            | any(.revisionName == $revision and .percent == 100)
          ' <<<"${service_json}" >/dev/null

      - name: Smoke service URL and production custom domain
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "${API_SERVICE}" \
            --project="${PROJECT_ID}" --region="${REGION}" \
            --format='value(status.url)')"
          smoke_ready() {
            local url="$1"
            for attempt in $(seq 1 24); do
              if curl --fail --silent --show-error \
                --connect-timeout 5 --max-time 15 "${url}" >/dev/null; then
                return 0
              fi
              echo "readiness attempt ${attempt}/24 failed for ${url}"
              sleep 5
            done
            return 1
          }
          smoke_ready "${SERVICE_URL}/readyz"
          smoke_ready "${SERVICE_URL}/api/v1/health"
          if [[ "${{ inputs.environment }}" == "production" ]]; then
            smoke_ready https://api.uvai.io/readyz
            smoke_ready https://api.uvai.io/api/v1/health
          fi

      - name: Rollback API traffic after failed rollout
        if: ${{ failure() && steps.promote.outcome != 'skipped' && steps.api_preflight.outputs.previous_revision != '' }}
        run: |
          set -euo pipefail
          previous_revision="${{ steps.api_preflight.outputs.previous_revision }}"
          gcloud run services update-traffic "${API_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --to-revisions="${previous_revision}=100" \
            --quiet
          service_json="$(gcloud run services describe "${API_SERVICE}" \
            --project="${PROJECT_ID}" --region="${REGION}" --format=json)"
          jq -e --arg revision "${previous_revision}" '
            any(.status.traffic[]?; .revisionName == $revision and .percent == 100)
          ' <<<"${service_json}" >/dev/null
          service_url="$(jq -er '.status.url' <<<"${service_json}")"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error \
              --connect-timeout 5 --max-time 15 \
              "${service_url}/api/v1/health" >/dev/null; then
              exit 0
            fi
            echo "rollback health attempt ${attempt}/12 failed"
            sleep 5
          done
          echo "::error::Previous API revision did not recover health"
          exit 1

      - name: Remove candidate tag after failed rollout
        if: ${{ failure() && steps.api_candidate.outputs.tag != '' }}
        run: |
          set -euo pipefail
          service_json="$(gcloud run services describe "${API_SERVICE}" \
            --project="${PROJECT_ID}" --region="${REGION}" --format=json)"
          if jq -e --arg tag "${{ steps.api_candidate.outputs.tag }}" '
            any(.status.traffic[]?; .tag == $tag)
          ' <<<"${service_json}" >/dev/null; then
            gcloud run services update-traffic "${API_SERVICE}" \
              --project="${PROJECT_ID}" \
              --region="${REGION}" \
              --remove-tags="${{ steps.api_candidate.outputs.tag }}" \
              --quiet
          fi

      - name: Deployment evidence
        run: |
          {
            echo '## API-cost PostgreSQL substrate deployment'
            echo '- Commit: `${{ github.sha }}`'
            echo '- Image: `${{ steps.image.outputs.uri }}`'
            echo '- Staging image source run: `${{ steps.release_gate.outputs.staging_run_id || github.run_id }}`'
            echo '- Prior API revision: `${{ steps.api_preflight.outputs.previous_revision }}`'
            echo '- API revision: `${{ steps.api_candidate.outputs.revision }}`'
            echo '- API service: `uvai-backend`'
            echo '- Worker service: `eventrelay-api-cost-worker`'
            echo '- Worker revision: `${{ steps.worker.outputs.revision }}`'
            echo '- Worker config: service min 1, service max 1, concurrency 1, CPU always allocated'
            echo '- Migration execution (primary): `${{ steps.migration_execution_primary.outputs.execution }}`'
            echo '- Migration execution (reconcile): `${{ steps.migration_execution_reconcile.outputs.execution || 'not-required' }}`'
            echo '- Delivery: **hard-coded disabled**'
            echo '- Database DDL secret version: `${{ steps.secret_versions.outputs.database_ddl }}`'
            echo '- Database DML secret version: `${{ steps.secret_versions.outputs.database_dml }}`'
            echo '- Gemini secret version: `${{ steps.secret_versions.outputs.gemini }}`'
            echo '- OpenAI secret version: `${{ steps.secret_versions.outputs.openai }}`'
            echo '- YouTube secret version: `${{ steps.secret_versions.outputs.youtube }}`'
            echo '- EventRelay secret version: `${{ steps.secret_versions.outputs.eventrelay }}`'
          } >> "${GITHUB_STEP_SUMMARY}"

name: Repository Reconciliation

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - ready_for_review
      - converted_to_draft
      - closed
  issues:
    types:
      - opened
      - reopened
      - closed
  create:
  delete:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: repository-reconciliation
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Prevent long-running jobs
    steps:
      - name: Reconcile canonical delivery state
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repoFullName = `${owner}/${repo}`;
            const escapedRepoFullName = repoFullName.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const now = Date.now();
            const staleAfterMs = 14 * 24 * 60 * 60 * 1000;
            const closingPattern = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+)?#(\d+)/gi;
            const isDependencyAutomationPR = pr =>
              pr.user?.login === "dependabot[bot]" &&
              /^build\(deps(?:-[^)]+)?\):/i.test(pr.title || "");
            const issueHasDispatchContract = issue => {
              const labels = (issue.labels || [])
                .map(label => typeof label === "string" ? label : label?.name)
                .filter(Boolean)
                .map(name => name.toLowerCase());
              if (labels.includes("agent-task")) {
                return true;
              }
              const body = (issue.body || "").toLowerCase();
              return (
                body.includes("agent run id") &&
                body.includes("declared file scope") &&
                body.includes("pre-dispatch confirmation")
              );
            };

            // Extract closing-issue references from a PR body, accepting only references that are
            // unqualified (`#N`) or explicitly qualified with THIS repository
            // (`owner/repo#N`). Cross-repo references like `Closes otherorg/otherrepo#42` are
            // ignored so they are never mapped onto local issue numbers.
            const extractIssueNumbers = (body) =>
              [...(body || "").matchAll(closingPattern)]
                .filter(m => !m[1] || m[1] === repoFullName)
                .map(m => Number(m[2]));

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: "open", per_page: 100
            });
            // Branch commit metadata comes from GraphQL with the branch page, avoiding one
            // REST getCommit call per stale branch. The reconciliation trigger intentionally
            // excludes pull_request.synchronize so it cannot compete with preview E2E lookup.
            const branchQuery = `
              query BranchInventory($owner: String!, $repo: String!, $cursor: String) {
                repository(owner: $owner, name: $repo) {
                  refs(refPrefix: "refs/heads/", first: 100, after: $cursor) {
                    totalCount
                    pageInfo { hasNextPage endCursor }
                    nodes {
                      name
                      branchProtectionRule { id }
                      target {
                        ... on Commit { oid committedDate }
                      }
                    }
                  }
                }
              }
            `;
            const branches = [];
            let totalBranches = 0;
            let branchCursor = null;
            try {
              do {
                const inventory = await github.graphql(branchQuery, {
                  owner, repo, cursor: branchCursor
                });
                const refs = inventory.repository.refs;
                totalBranches = refs.totalCount;
                branches.push(...refs.nodes);
                branchCursor = refs.pageInfo.hasNextPage ? refs.pageInfo.endCursor : null;
              } while (branchCursor);
            } catch (err) {
              if (err.status === 403 && /rate limit/i.test(err.message || "")) {
                core.info("Repository reconciliation deferred: GitHub API rate limit reached before branch inventory completed.");
                return;
              }
              throw err;
            }
            // Only track head refs from PRs targeting this repository (not forks) to prevent
            // branch-name collisions between fork branches and local branches.
            const activeHeads = new Set(
              pulls
                .filter(pr => pr.head.repo && pr.head.repo.full_name === repoFullName)
                .map(pr => pr.head.ref)
            );

            // Collect all unique issue numbers referenced across open PRs and validate each one
            // against the Issues API before using them for classification. This prevents textual
            // references like "Closes #999999" from creating fictitious duplicate groups.
            const allIssueNumbers = new Set();
            for (const pr of pulls) {
              const nums = extractIssueNumbers(pr.body);
              nums.forEach(n => allIssueNumbers.add(n));
            }
            const validIssues = new Set();
            const dispatchContractIssues = new Set();
            for (const issueNum of allIssueNumbers) {
              try {
                const resp = await github.rest.issues.get({ owner, repo, issue_number: issueNum });
                if (!resp.data.pull_request) {
                  validIssues.add(issueNum);
                  if (issueHasDispatchContract(resp.data)) {
                    dispatchContractIssues.add(issueNum);
                  }
                }
              } catch (err) {
                if (err.status !== 404) throw err;
                // 404 → non-existent; skip silently
              }
            }

            const untracked = [];
            const issueToPulls = new Map();
            let truthGateArmedCount = 0;
            for (const pr of pulls) {
              const issues = extractIssueNumbers(pr.body);
              // Restrict to validated issue references only.
              const validUnique = [...new Set(issues)].filter(n => validIssues.has(n));
              const dispatchContracts = validUnique.filter(n => dispatchContractIssues.has(n));
              if (dispatchContracts.length === 1) {
                truthGateArmedCount += 1;
              }
              // Drafts mirror the governance workflow's deferred-enforcement rule and are excluded.
              // Dependabot dependency bumps are automation-managed and excluded from this drift gate.
              if (validUnique.length !== 1 && !pr.draft && !isDependencyAutomationPR(pr)) {
                untracked.push(pr);
              }
              for (const issue of validUnique) {
                const existing = issueToPulls.get(issue) || [];
                existing.push(pr.number);
                issueToPulls.set(issue, existing);
              }
            }

            const duplicates = [...issueToPulls.entries()]
              .filter(([, numbers]) => numbers.length > 1);

            const staleBranches = [];
            for (const branch of branches) {
              // Exclude main, protected branches, and branches attached to open PRs.
              if (branch.name === "main" || branch.branchProtectionRule || activeHeads.has(branch.name)) continue;
              const date = branch.target?.committedDate;
              if (date && now - new Date(date).getTime() > staleAfterMs) {
                staleBranches.push({ name: branch.name, date, sha: branch.target.oid.slice(0, 8) });
              }
            }

            const lines = [
              "## Canonical delivery-state reconciliation",
              "",
              `Generated: ${new Date().toISOString()}`,
              "",
              `- Open PRs: **${pulls.length}**`,
              `- Total remote branches: **${totalBranches}**`,
              `- Ready PRs without exactly one canonical issue: **${untracked.length}**`,
              `- Truth-gate armed PRs (real dispatch contracts): **${truthGateArmedCount}**`,
              `- Issues with competing implementation PRs: **${duplicates.length}**`,
              `- Unattached branches older than 14 days: **${staleBranches.length}**`,
              "",
              "### PRs requiring canonical issue",
              untracked.length
                ? untracked.map(pr => `- #${pr.number} — ${pr.title}`).join("\n")
                : "- None",
              "",
              "### Competing PRs",
              duplicates.length
                ? duplicates.map(([issue, numbers]) => `- Issue #${issue}: ${numbers.map(n => `#${n}`).join(", ")}`).join("\n")
                : "- None",
              "",
              "### Stale unattached branches",
              staleBranches.length
                ? staleBranches.slice(0, 100).map(branch =>
                    `- \`${branch.name}\` — ${branch.sha}, last commit ${branch.date}`
                  ).join("\n")
                : "- None",
              "",
              "> This report is intentionally non-destructive. Branch deletion requires a merged PR or an explicit retention decision.",
              "",
              "Canonical governance: #898"
            ];

            const title = "[automation] Repository drift report";
            const query = `repo:${owner}/${repo} is:issue is:open in:title "${title}"`;
            const existing = await github.rest.search.issuesAndPullRequests({
              q: query, per_page: 10
            });
            const report = existing.data.items.find(item => item.title === title);
            const body = lines.join("\n");

            let reportNumber;
            if (report) {
              reportNumber = report.number;
              await github.rest.issues.update({
                owner, repo, issue_number: report.number, body
              });
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body });
              reportNumber = created.data.number;
            }

            // --- Remediation: comment on non-draft PRs missing a canonical issue ---
            const botTag = "<!-- reconciliation-missing-issue -->";
            for (const pr of untracked) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number, per_page: 100
              });
              if (comments.some(c => (c.body || "").includes(botTag))) continue;
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number,
                body: `${botTag}\n⚠️ **Repository reconciliation**: this PR does not reference exactly one canonical issue.\n\nPlease add a \`Closes #<issue>\` reference in the PR description so it can be tracked against the delivery plan.\n\nSee governance: #898`
              });
            }

            // --- Remediation: auto-close superseded competing draft PRs ---
            const supersedesPattern = /supersedes\s+(?:stalled\s+)?(?:draft\s+)?#(\d+)/gi;
            for (const [issue, numbers] of duplicates) {
              // For each competing group, check if any PR explicitly supersedes another.
              const competingPRs = pulls.filter(p => numbers.includes(p.number));
              for (const pr of competingPRs) {
                const superseded = [...(pr.body || "").matchAll(supersedesPattern)]
                  .map(m => Number(m[1]));
                for (const targetNum of superseded) {
                  const target = competingPRs.find(p => p.number === targetNum);
                  if (!target || !target.draft) continue;
                  // Close the superseded draft PR with explanation.
                  const closedComments = await github.paginate(github.rest.issues.listComments, {
                    owner, repo, issue_number: targetNum, per_page: 100
                  });
                  const closeTag = "<!-- reconciliation-superseded -->";
                  if (closedComments.some(c => (c.body || "").includes(closeTag))) continue;
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: targetNum,
                    body: `${closeTag}\n🔄 **Auto-closed by repository reconciliation**: this draft PR has been superseded by #${pr.number}, which implements the same issue #${issue}.\n\nSee governance: #898`
                  });
                  await github.rest.pulls.update({
                    owner, repo, pull_number: targetNum, state: "closed"
                  });
                  core.info(`Closed superseded draft PR #${targetNum} (superseded by #${pr.number} for issue #${issue})`);
                }
              }
            }

            // --- Close the drift report issue when all findings are zero ---
            if (reportNumber && untracked.length === 0 && duplicates.length === 0 && staleBranches.length === 0) {
              await github.rest.issues.update({
                owner, repo, issue_number: reportNumber,
                state: "closed", state_reason: "completed"
              });
              core.info("All drift findings resolved — closed the report issue.");
            }

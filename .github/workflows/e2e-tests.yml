name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write
  deployments: read

env:
  # The workflow resolves the successful Vercel deployment for the triggering
  # SHA: Preview for pull requests, Production for pushes to main. Previews also
  # need `VERCEL_AUTOMATION_BYPASS_SECRET` as a repository secret.
  # Vercel previews return HTTP 401 to anonymous traffic; the test harness
  # forwards this value as the `x-vercel-protection-bypass` header on every
  # request (see tests/e2e/pipeline.test.ts). Generate it under Vercel →
  # Project → Settings → Deployment Protection → Protection Bypass for
  # Automation.
  TEST_YOUTUBE_URL: https://www.youtube.com/watch?v=auJzb1D-fag
  VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

jobs:
  e2e:
    name: E2E Pipeline Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checked-out SHA
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Require preview bypass credential
        if: github.event_name == 'pull_request'
        run: |
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::error::VERCEL_AUTOMATION_BYPASS_SECRET is required for PR E2E"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Resolve exact-SHA Vercel deployment
        id: deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          ENVIRONMENT="${{ github.event_name == 'pull_request' && 'Preview' || 'Production' }}"
          DEPLOYMENT_URL=""

          # Bind the target to Vercel's verified global bot account. The stable
          # numeric ID prevents an environment-name-only deployment spoof.
          if [ "$ENVIRONMENT" = "Preview" ]; then
            FILTER='.[] | select(.creator.id == 35613825 and .creator.login == "vercel[bot]" and .creator.type == "Bot" and .task == "deploy" and ((.environment // "") | ascii_downcase | startswith("preview"))) | .id'
          else
            FILTER='.[] | select(.creator.id == 35613825 and .creator.login == "vercel[bot]" and .creator.type == "Bot" and .task == "deploy" and ((.environment // "") | ascii_downcase == "production")) | .id'
          fi

          for i in $(seq 1 30); do
            DEPLOYMENT_STATUS=0
            DEPLOY_IDS=$(gh api \
              "/repos/${{ github.repository }}/deployments?sha=${SHA}&per_page=100" \
              --paginate \
              --jq "$FILTER" 2>deployments.err) || DEPLOYMENT_STATUS=$?
            if [ -s deployments.err ]; then
              echo "gh api deployments stderr:" >&2
              cat deployments.err >&2
            fi
            rm -f deployments.err

            if [ "${DEPLOYMENT_STATUS:-0}" != "0" ]; then
              exit "$DEPLOYMENT_STATUS"
            fi

            while IFS= read -r DEPLOY_ID; do
              if [ -z "$DEPLOY_ID" ]; then
                continue
              fi

              STATUS_LOOKUP=0
              DEPLOYMENT_URL=$(gh api \
                "/repos/${{ github.repository }}/deployments/${DEPLOY_ID}/statuses" \
                --jq '[.[] | select(.state == "success" and .creator.id == 35613825 and .creator.login == "vercel[bot]" and .creator.type == "Bot")] | first | .environment_url // empty' 2>deployment-status.err) || STATUS_LOOKUP=$?
              if [ -s deployment-status.err ]; then
                echo "gh api deployment statuses stderr:" >&2
                cat deployment-status.err >&2
              fi
              rm -f deployment-status.err

              if [ "${STATUS_LOOKUP:-0}" != "0" ]; then
                exit "$STATUS_LOOKUP"
              fi

              if [ -n "$DEPLOYMENT_URL" ]; then
                break
              fi
            done <<< "$DEPLOY_IDS"

            if [ -n "$DEPLOYMENT_URL" ]; then
              break
            fi

            sleep 10
          done

          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "::error::No successful ${ENVIRONMENT} deployment found for exact SHA ${SHA}"
            exit 1
          fi

          echo "BASE_URL=$DEPLOYMENT_URL" >> "$GITHUB_ENV"
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run E2E tests
        id: e2e_tests
        continue-on-error: true
        run: |
          npx vitest run tests/e2e/ --reporter=verbose 2>&1 | tee test-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Parse test results
        id: results
        if: always()
        run: |
          if [ "${{ steps.e2e_tests.outputs.exit_code }}" = "0" ]; then
            echo "status=green" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
            echo "message=ALL TESTS PASSED" >> $GITHUB_OUTPUT
          else
            echo "status=red" >> $GITHUB_OUTPUT
            echo "emoji=🔴" >> $GITHUB_OUTPUT
            echo "message=FAILURE DETECTED" >> $GITHUB_OUTPUT
          fi

          # Extract summary stats
          TOTAL=$(grep -oP 'Tests\s+\K\d+' test-output.txt | tail -1 || echo "?")
          PASSED=$(grep -oP '\d+(?=\s+passed)' test-output.txt | tail -1 || echo "?")
          FAILED=$(grep -oP '\d+(?=\s+failed)' test-output.txt | tail -1 || echo "0")
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT

      - name: Post PR comment with results
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            const status = '${{ steps.results.outputs.status }}';
            const emoji = '${{ steps.results.outputs.emoji }}';
            const message = '${{ steps.results.outputs.message }}';
            const total = '${{ steps.results.outputs.total }}';
            const passed = '${{ steps.results.outputs.passed }}';
            const failed = '${{ steps.results.outputs.failed }}';

            const fs = require('fs');
            let output = '';
            try {
              output = fs.readFileSync('test-output.txt', 'utf8');
              // Truncate if too long
              if (output.length > 3000) {
                output = output.slice(-3000);
              }
            } catch {}

            const body = [
              `## ${emoji} E2E Test Results: ${message}`,
              '',
              `| Metric | Value |`,
              `|--------|-------|`,
              `| Status | ${status === 'green' ? '🟢 GREEN' : '🔴 RED'} |`,
              `| Total Tests | ${total} |`,
              `| Passed | ${passed} |`,
              `| Failed | ${failed} |`,
              `| Deployment | ${process.env.BASE_URL} |`,
              '',
              '<details>',
              '<summary>Test Output</summary>',
              '',
              '```',
              output,
              '```',
              '</details>',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Log failure to the job summary
        if: steps.results.outputs.status == 'red'
        env:
          # Passed via env, not interpolated inline: github.head_ref is the PR
          # source branch name and is attacker-controlled on pull_request events.
          # Expanding it directly in the run: script would allow shell injection
          # (flagged by actionlint/zizmor). The shell receives these as data only.
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_REF: ${{ github.head_ref || github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          FAILURES=$(grep -A 2 'FAIL\|AssertionError\|Error:' test-output.txt | head -30 || echo "See test-output.txt")

          {
            echo "### 🔴 E2E Failure — $DATE"
            echo ""
            echo "**Trigger:** ${TRIGGER_EVENT} on \`${TRIGGER_REF}\`"
            echo "**Commit:** \`${COMMIT_SHA}\`"
            echo "**Deployment:** $BASE_URL"
            echo ""
            echo "**Failed tests:**"
            echo '```'
            echo "$FAILURES"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the job if tests failed
        if: steps.results.outputs.status == 'red'
        run: |
          echo "🔴 FAILURE DETECTED — E2E tests did not pass."
          echo "Check test-output.txt for details."
          exit 1

      - name: Green signal
        if: steps.results.outputs.status == 'green'
        run: |
          echo "✅ ALL TESTS PASSED"
          echo "Deployment at $BASE_URL is healthy."

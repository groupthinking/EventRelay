name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  BASE_URL: https://uvai.io
  TEST_YOUTUBE_URL: https://www.youtube.com/watch?v=dQw4w9WgXcQ

jobs:
  e2e:
    name: E2E Pipeline Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run E2E tests
        id: e2e_tests
        continue-on-error: true
        run: |
          npx vitest run tests/e2e/ --reporter=verbose 2>&1 | tee test-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Parse test results
        id: results
        if: always()
        run: |
          if [ "${{ steps.e2e_tests.outputs.exit_code }}" = "0" ]; then
            echo "status=green" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
            echo "message=ALL TESTS PASSED" >> $GITHUB_OUTPUT
          else
            echo "status=red" >> $GITHUB_OUTPUT
            echo "emoji=🔴" >> $GITHUB_OUTPUT
            echo "message=FAILURE DETECTED" >> $GITHUB_OUTPUT
          fi

          # Extract summary stats
          TOTAL=$(grep -oP 'Tests\s+\K\d+' test-output.txt | tail -1 || echo "?")
          PASSED=$(grep -oP '\d+(?=\s+passed)' test-output.txt | tail -1 || echo "?")
          FAILED=$(grep -oP '\d+(?=\s+failed)' test-output.txt | tail -1 || echo "0")
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT

      - name: Post PR comment with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ steps.results.outputs.status }}';
            const emoji = '${{ steps.results.outputs.emoji }}';
            const message = '${{ steps.results.outputs.message }}';
            const total = '${{ steps.results.outputs.total }}';
            const passed = '${{ steps.results.outputs.passed }}';
            const failed = '${{ steps.results.outputs.failed }}';

            const fs = require('fs');
            let output = '';
            try {
              output = fs.readFileSync('test-output.txt', 'utf8');
              // Truncate if too long
              if (output.length > 3000) {
                output = output.slice(-3000);
              }
            } catch {}

            const body = [
              `## ${emoji} E2E Test Results: ${message}`,
              '',
              `| Metric | Value |`,
              `|--------|-------|`,
              `| Status | ${status === 'green' ? '🟢 GREEN' : '🔴 RED'} |`,
              `| Total Tests | ${total} |`,
              `| Passed | ${passed} |`,
              `| Failed | ${failed} |`,
              `| Deployment | ${process.env.BASE_URL} |`,
              '',
              '<details>',
              '<summary>Test Output</summary>',
              '',
              '```',
              output,
              '```',
              '</details>',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Log failure to failure-log.md
        if: steps.results.outputs.status == 'red'
        run: |
          DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          FAILURES=$(grep -A 2 'FAIL\|AssertionError\|Error:' test-output.txt | head -30 || echo "See test-output.txt")

          cat >> tests/failure-log.md << EOF

          ---

          ### 🔴 Failure — $DATE

          **Trigger:** ${{ github.event_name }} on \`${{ github.ref_name }}\`
          **Commit:** \`${{ github.sha }}\`
          **Runner:** GitHub Actions

          **Failed tests:**
          \`\`\`
          $FAILURES
          \`\`\`

          **Status:** Logged automatically. Manual investigation required.
          EOF

          git config user.email "ci@eventrelay.dev"
          git config user.name "EventRelay CI"
          git add tests/failure-log.md
          git commit -m "ci: log E2E test failure [skip ci]" || true
          git push || true

      - name: Fail the job if tests failed
        if: steps.results.outputs.status == 'red'
        run: |
          echo "🔴 FAILURE DETECTED — E2E tests did not pass."
          echo "Check test-output.txt for details."
          exit 1

      - name: Green signal
        if: steps.results.outputs.status == 'green'
        run: |
          echo "✅ ALL TESTS PASSED"
          echo "Deployment at $BASE_URL is healthy."

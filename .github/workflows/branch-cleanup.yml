name: Branch Cleanup

# Manual, gated branch pruning driven by the branch-cleanup assessment.
# Runs the archive-then-delete harness server-side, where the GITHUB_TOKEN has
# the `contents: write` rights needed to delete refs (the web sandbox cannot).
#
# Two ways to trigger:
#   1. workflow_dispatch (after this lands on the default branch): Actions UI,
#      pick batch + dry_run.
#   2. push sentinel (works from this feature branch right now): push a commit to
#      this branch whose message contains [run-cleanup:safe] (or :stale/:review).
#      That executes the batch for real (DRY_RUN=0). Normal pushes are a no-op.
#
# Safety: dispatch defaults to dry_run=true; the push path requires an explicit
# sentinel. Every branch SHA is recorded + uploaded as an artifact, so deletions
# are reversible:  git push origin <sha>:refs/heads/<branch>.

on:
  workflow_dispatch:
    inputs:
      batch:
        description: "Which verdict batch to delete"
        required: true
        default: safe
        type: choice
        options: [safe, stale, review]
      dry_run:
        description: "Preview only (no deletion). Set to false to actually delete."
        required: true
        default: true
        type: boolean
  push:
    branches: ["claude/branch-cleanup-assessment-ctDVh"]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need all remote refs to tag/delete them

      - id: decide
        name: Decide batch / dry-run from trigger
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "batch=${{ inputs.batch }}" >> "$GITHUB_OUTPUT"
            echo "dry=${{ inputs.dry_run == true && '1' || '0' }}" >> "$GITHUB_OUTPUT"
            echo "go=yes" >> "$GITHUB_OUTPUT"
          else
            msg=$(git log -1 --pretty=%B)
            if echo "$msg" | grep -qE '\[run-cleanup:(safe|stale|review)\]'; then
              b=$(echo "$msg" | sed -nE 's/.*\[run-cleanup:(safe|stale|review)\].*/\1/p' | head -1)
              echo "batch=$b" >> "$GITHUB_OUTPUT"
              echo "dry=0" >> "$GITHUB_OUTPUT"
              echo "go=yes" >> "$GITHUB_OUTPUT"
              echo "::notice::sentinel detected — executing '$b' batch (real delete)"
            else
              echo "go=no" >> "$GITHUB_OUTPUT"
              echo "::notice::no [run-cleanup:*] sentinel in commit message — no-op"
            fi
          fi

      - name: Run branch-cleanup delete
        if: steps.decide.outputs.go == 'yes'
        env:
          DRY_RUN: ${{ steps.decide.outputs.dry }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          chmod +x scripts/maintenance/branch-cleanup-delete.sh
          scripts/maintenance/branch-cleanup-delete.sh "${{ steps.decide.outputs.batch }}"

      - name: Upload recovery refs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-cleanup-recovery-refs
          path: docs/branch-cleanup-recovery-refs.txt
          if-no-files-found: warn

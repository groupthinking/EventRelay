name: Agent completion enforcement

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled, edited]
  workflow_dispatch:
    inputs:
      pull_request:
        required: true
        type: number

permissions: {}

jobs:
  enforce:
    name: Agent completion enforcement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
      pull-requests: read
    steps:
      - name: Check out only the protected default-branch verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Require a trusted, append-only publication
        id: verify
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pull_request || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$PR"
          head="$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)"
          # The trusted GitHub App must publish this immutable report as a Check
          # output/artifact. This workflow never executes PR-controlled code or
          # accepts an artifact produced by a pull_request workflow.
          gh api "repos/$REPO/commits/$head/check-runs" --jq '.check_runs[] | select(.name == "Agent Lock trusted publication") | .output.text' > trusted-report.json
          if test -s trusted-report.json; then
            python3 scripts/ci/agent_completion_enforcement.py trusted-report.json .github/agent-lock/trusted-publishers.json "$head" "$PR" > enforcement-verdict.json
          else
            # If the policy is unprovisioned (all allowlists empty), yield a neutral advisory
            # rather than a hard failure so PRs are not blocked while the GitHub App is not yet configured.
            if python3 - <<'EOF'
import json, sys
p = json.load(open('.github/agent-lock/trusted-publishers.json'))
provisioned = bool(
    p.get('trusted_check_app_slugs') and
    p.get('trusted_label_actors') and
    p.get('trusted_human_exemption_actors')
)
sys.exit(0 if provisioned else 1)
EOF
            then
              printf '%s\n' '{"conclusion":"failure","reason":"missing_trusted_publication","details":{}}' > enforcement-verdict.json
            else
              printf '%s\n' '{"conclusion":"neutral","reason":"trust_policy_unprovisioned","details":{}}' > enforcement-verdict.json
            fi
          fi
      - name: Publish the required head-bound Check run
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR: ${{ inputs.pull_request || github.event.pull_request.number }}
        with:
          script: |
            const fs = require('fs');
            const pull = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR)
            });
            let verdict = {
              conclusion: 'failure',
              reason: 'verifier_did_not_publish',
              details: {}
            };
            try {
              verdict = JSON.parse(fs.readFileSync(
                'enforcement-verdict.json', 'utf8'
              ));
            } catch (error) {
              core.warning(error.message);
            }
            const conclusion = verdict.conclusion === 'success'
              ? 'success'
              : verdict.conclusion === 'neutral'
                ? 'neutral'
                : 'failure';
            const summary = JSON.stringify(verdict);
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Agent completion enforcement',
              head_sha: pull.data.head.sha,
              status: 'completed',
              conclusion,
              output: {
                title: conclusion === 'success'
                  ? 'Trusted evidence verified'
                  : conclusion === 'neutral'
                    ? 'Trusted publisher not yet configured (advisory)'
                    : 'Trusted evidence blocked',
                summary: summary.slice(0, 60000)
              }
            });
            if (conclusion !== 'success' && conclusion !== 'neutral') {
              core.setFailed(verdict.reason || 'trusted evidence blocked');
            }

name: gh-aw Validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/*.md"
      - ".github/workflows/*.lock.yml"
      - ".github/workflows/gh-aw-validation.yml"
      - ".github/aw/actions-lock.json"
      - ".poutine.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/*.md"
      - ".github/workflows/*.lock.yml"
      - ".github/workflows/gh-aw-validation.yml"
      - ".github/aw/actions-lock.json"
      - ".poutine.yml"
  workflow_dispatch:

permissions:
  contents: read


# Supersede superseded work instead of stacking it. Without this, every push
# to a PR branch queued a brand-new full run alongside the ones it obsoleted;
# with ~30 workflows and dozens of open PRs the Actions queue could not drain.
#
# PR runs are keyed by PR number and cancel their predecessors -- that is where
# all the queue pressure comes from, since every `push:` trigger here is already
# filtered to main. Non-PR runs (push, schedule) are keyed by commit SHA so they
# land in singleton groups: keying them on github.ref would collide every merge
# to main into one group, and GitHub cancels the *pending* run in a group, so a
# burst of merges would silently drop the middle commits' verdicts.
concurrency:
  group: gh-aw-validation-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  validate-gh-aw:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Prevent long-running jobs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned gh-aw runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension remove aw || true
          gh extension install github/gh-aw --pin v0.88.7
          ACTUAL_VERSION="$(gh aw version 2>&1 | awk '{print $NF}')"
          if [ "$ACTUAL_VERSION" != "v0.88.7" ]; then
            echo "Expected gh aw v0.88.7 but got $ACTUAL_VERSION"
            exit 1
          fi
          PRERELEASE="$(gh api repos/github/gh-aw/releases/tags/v0.88.7 --jq '.prerelease')"
          if [ "$PRERELEASE" != "false" ]; then
            echo "v0.88.7 must remain a stable release"
            exit 1
          fi

      - name: Verify lock declaration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          
          data = json.loads(Path('.github/aw/actions-lock.json').read_text())
          expected = {
              'github/gh-aw-actions/setup-cli@v0.88.7': '5e508589e03a7757a7e05b26e834292f5445bfb6',
              'github/gh-aw-actions/setup@v0.88.7': '5e508589e03a7757a7e05b26e834292f5445bfb6',
          }
          entries = data.get('entries', {})
          for key, sha in expected.items():
              entry = entries.get(key)
              if not entry:
                  raise SystemExit(f'actions-lock.json missing required entry: {key}')
              if entry.get('sha') != sha:
                  raise SystemExit(f'actions-lock.json has unexpected SHA for {key}')
          PY

      - name: Compile and validate workflows
        run: |
          gh aw compile \
            canonical-pr-remediator \
            focused-coverage-controller \
            pr-iteration-loop \
            repo-assist \
            --validate \
            --approve

      - name: Run actionlint, zizmor, and poutine checks
        run: |
          gh aw compile \
            canonical-pr-remediator \
            focused-coverage-controller \
            pr-iteration-loop \
            repo-assist \
            --actionlint \
            --zizmor \
            --poutine \
            --approve

      - name: Verify compiled lock files are committed
        run: |
          git diff --exit-code -- \
            .github/workflows/canonical-pr-remediator.lock.yml \
            .github/workflows/focused-coverage-controller.lock.yml \
            .github/workflows/pr-iteration-loop.lock.yml \
            .github/workflows/repo-assist.lock.yml

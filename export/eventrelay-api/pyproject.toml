[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eventrelay-api"
version = "0.1.0"
description = "EventRelay — a clean, linear YouTube-to-events API. Paste a URL; get a transcript, typed <domain>.<entity>.<action> events, and derived artifacts over one job-centric contract."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "UNLICENSED" }

# Core runtime. The pipeline runs with just these; transcript fetching and the
# model seam are optional extras so the service starts (and tests run) without
# network, keys, or a database.
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
# SC2 — caption transcript provider.
youtube = ["youtube-transcript-api>=1.0.0"]
# SC3/SC4 — default model seam (swap for Anthropic/OpenAI by implementing the
# same LLMClient interface in service/app/llm/ and binding it in the container).
gemini = ["google-genai>=1.0.0"]
# SC6 — Postgres async driver.
postgres = ["asyncpg>=0.29.0"]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
]

[tool.setuptools.packages.find]
# `service/` is an implicit-namespace dir (no __init__); namespace discovery
# picks up service.app and its subpackages.
include = ["service*"]
namespaces = true

# ── Tooling (kept identical to the spine's house style) ──

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts Depends()/Query() in argument
# defaults by design — not the B008 mutable-default footgun.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.mypy]
python_version = "3.10"
strict = true
disallow_untyped_defs = true
files = ["service/app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["service/tests"]
asyncio_mode = "auto"
addopts = "-q"

[project]
name = "prescient-twin"
version = "0.1.0"
description = "Self-evolving agent architecture with hybrid model routing"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "smolagents>=1.14.0",
    "google-genai>=1.0.0",
    "e2b-code-interpreter>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "litellm>=1.50.0",
    "chromadb>=0.6.0",
    "aiohttp>=3.11.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["*.py"]

[tool.uv]
# Isolate from parent workspace
package = true

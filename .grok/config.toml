# Project-scoped Grok Build MCP servers for EventRelay / UVAI.
# Official project path: ./.grok/config.toml
# Docs: https://docs.x.ai/build/features/mcp-servers
#       https://docs.x.ai/build/settings
#
# Project configs may only declare [mcp_servers] (plus plugins/permission
# rules). Do not put personal [models]/[ui] settings here.
#
# Secrets stay in the environment. Grok expands ${VAR} at load time.
# Never commit GITHUB_TOKEN, VERCEL_TOKEN, or VERCEL_TEAM_ID values.
#
# These stubs are already committed. Prefer leaving them as-is and exporting
# tokens only in the shell that launches Grok — not before `grok mcp add`.
# Do not pass a double-quoted Authorization header that interpolates
# GITHUB_TOKEN. The shell expands it, and Grok writes the literal secret
# into this tracked file.
#
# If you must re-write a stub, keep the placeholder literal with single quotes
# (bash does not expand inside single quotes):
#   grok mcp add --transport http -s project github https://api.githubcopilot.com/mcp/ \
#     --header 'Authorization: Bearer ${GITHUB_TOKEN}'
#   grok mcp add --transport http -s project vercel https://mcp.vercel.com
#
# GitHub's official MCP is remote HTTP (or Docker ghcr.io/github/github-mcp-server).
# Do not use npx @github/github-mcp-server — that package is not on npm.
#
# Export tokens in the same shell that launches Grok:
#   export GITHUB_TOKEN=...
#   export VERCEL_TOKEN=...
#   export VERCEL_TEAM_ID=...   # optional; starts with team_
#
# Confirm discovery:
#   grok inspect --cwd <EventRelay>

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
headers = { Authorization = "Bearer ${GITHUB_TOKEN}" }

[mcp_servers.vercel]
url = "https://mcp.vercel.com"
headers = { Authorization = "Bearer ${VERCEL_TOKEN}" }
env = { VERCEL_TOKEN = "${VERCEL_TOKEN}", VERCEL_TEAM_ID = "${VERCEL_TEAM_ID}" }

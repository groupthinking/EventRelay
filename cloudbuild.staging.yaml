steps:
  # [Level 6 Innovation] Autonomous Optimization Gatekeeper
  # Runs the MCP Agent to audit and optimize code in-place before packaging.
  # This ensures the deployed artifact includes JIT performance patches.
  # - name: 'python:3.11-slim'
  #   entrypoint: 'bash'
  #   args:
  #     - '-c'
  #     - |
  #       pip install mcp
  #       python3 mcp-servers/mcp-profiling/manager_client.py

  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/uvai-730bb/uvai-backend/eventrelay-backend:staging', '-f', 'Dockerfile', '.']

  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/uvai-730bb/uvai-backend/eventrelay-backend:staging']

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'eventrelay-staging'
      - '--image'
      - 'us-central1-docker.pkg.dev/uvai-730bb/uvai-backend/eventrelay-backend:staging'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8000'
      - '--memory'
      - '2Gi'
      - '--set-env-vars'
      - 'ENV=staging,PROJECT_ID=uvai-730bb'

images:
  - 'us-central1-docker.pkg.dev/uvai-730bb/uvai-backend/eventrelay-backend:staging'

# Job Queries and Mutations for Video Analysis Pipeline

# Create a new video analysis job
mutation createVideoJob(
  $videoUrl: String!
  $source: String!
  $taskType: String!
) @auth(level: USER) {
  videoJob_insert(
    data: {
      userId_expr: "auth.uid"
      videoUrl: $videoUrl
      source: $source
      taskType: $taskType
      status: "QUEUED"
      executedAgents: []
    }
  )
}

# Update job status
mutation updateJobStatus(
  $id: UUID!
  $status: String!
  $executedAgents: [String!]
) @auth(level: USER) {
  videoJob_updateMany(
    where: { id: { eq: $id }, userId: { eq_expr: "auth.uid" } }
    data: {
      status: $status
      executedAgents: $executedAgents
      updatedAt_expr: "request.time"
    }
  )
}

# Complete a job with result
mutation completeJob($id: UUID!, $resultJson: String!, $title: String)
@auth(level: USER) {
  videoJob_updateMany(
    where: { id: { eq: $id }, userId: { eq_expr: "auth.uid" } }
    data: {
      status: "COMPLETED"
      resultJson: $resultJson
      title: $title
      updatedAt_expr: "request.time"
    }
  )
}

# Fail a job with error
mutation failJob($id: UUID!, $error: String!) @auth(level: USER) {
  videoJob_updateMany(
    where: { id: { eq: $id }, userId: { eq_expr: "auth.uid" } }
    data: { status: "FAILED", error: $error, updatedAt_expr: "request.time" }
  )
}

# Record a job event
mutation recordJobEvent(
  $jobId: UUID!
  $eventType: String!
  $agent: String
  $details: String
) @auth(level: USER) {
  jobEvent_insert(
    data: {
      userId_expr: "auth.uid"
      job: { id: $jobId }
      eventType: $eventType
      agent: $agent
      details: $details
    }
  )
}

# Get job by ID
query getJob($id: UUID!) @auth(level: USER) {
  videoJobs(where: { id: { eq: $id }, userId: { eq_expr: "auth.uid" } }) {
    id
    videoUrl
    source
    taskType
    status
    executedAgents
    resultJson
    error
    title
    createdAt
    updatedAt
  }
}

# List all jobs
query listJobs($limit: Int = 50) @auth(level: USER) {
  videoJobs(
    where: { userId: { eq_expr: "auth.uid" } }
    orderBy: [{ createdAt: DESC }]
    limit: $limit
  ) {
    id
    videoUrl
    source
    taskType
    status
    title
    createdAt
    updatedAt
  }
}

# Get job events
query getJobEvents($jobId: UUID!) @auth(level: USER) {
  jobEvents(
    where: { job: { id: { eq: $jobId }, userId: { eq_expr: "auth.uid" } } }
    orderBy: [{ timestamp: ASC }]
  ) {
    id
    eventType
    agent
    details
    timestamp
  }
}

# =============================================================================
# EMBEDDING OPERATIONS (pgvector)
# Note: Storing embeddings (INSERT with Vector) is done via raw SQL in the
# embedding service because the SDK generator doesn't support Vector arguments.
# =============================================================================

# List recent embeddings (similarity search done in application layer)
query listEmbeddings($limit: Int = 100) @auth(level: USER) {
  videoEmbeddings(
    where: { job: { userId: { eq_expr: "auth.uid" } } }
    orderBy: [{ createdAt: DESC }]
    limit: $limit
  ) {
    id
    segmentType
    segmentIndex
    content
    job {
      id
      title
      videoUrl
    }
  }
}

# Get all embeddings for a specific job
query getJobEmbeddings($jobId: UUID!) @auth(level: USER) {
  videoEmbeddings(
    where: { job: { id: { eq: $jobId }, userId: { eq_expr: "auth.uid" } } }
    orderBy: [{ segmentType: ASC }, { segmentIndex: ASC }]
  ) {
    id
    segmentType
    segmentIndex
    content
    createdAt
  }
}

# Delete embeddings for a job (for re-processing)
mutation deleteJobEmbeddings($jobId: UUID!) @auth(level: USER) {
  videoEmbedding_deleteMany(where: { job: { id: { eq: $jobId }, userId: { eq_expr: "auth.uid" } } })
}

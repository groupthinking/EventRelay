# Example queries for EventRelay Video Analysis Pipeline
# These demonstrate the available queries for the VideoJob/JobEvent/VideoEmbedding schema.
# Production operations are in jobs/jobs.gql

# List all video jobs, most recent first
query ListVideoJobs @auth(level: PUBLIC) {
  videoJobs(orderBy: [{ createdAt: DESC }], limit: 20) {
    id
    videoUrl
    source
    taskType
    status
    title
    createdAt
    updatedAt
  }
}

# Get a specific video job by ID with full details
query GetVideoJob($id: UUID!) @auth(level: PUBLIC) {
  videoJob(id: $id) {
    id
    videoUrl
    source
    taskType
    status
    executedAgents
    resultJson
    error
    title
    duration
    fileSize
    createdAt
    updatedAt
  }
}

# List job events for a specific job, ordered chronologically
query ListJobEvents($jobId: UUID!) @auth(level: PUBLIC) {
  jobEvents(
    where: { job: { id: { eq: $jobId } } }
    orderBy: [{ timestamp: ASC }]
  ) {
    id
    eventType
    agent
    details
    timestamp
  }
}

# List recent video embeddings
query ListVideoEmbeddings($limit: Int = 50) @auth(level: PUBLIC) {
  videoEmbeddings(orderBy: [{ createdAt: DESC }], limit: $limit) {
    id
    segmentType
    segmentIndex
    content
    job {
      id
      title
      videoUrl
    }
    createdAt
  }
}

# List only failed jobs for debugging
query ListFailedJobs @auth(level: PUBLIC) {
  videoJobs(
    where: { status: { eq: "FAILED" } }
    orderBy: [{ updatedAt: DESC }]
    limit: 20
  ) {
    id
    videoUrl
    error
    executedAgents
    updatedAt
  }
}

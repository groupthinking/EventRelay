# Example mutations for EventRelay Video Analysis Pipeline
# These demonstrate the available mutations for the VideoJob/JobEvent schema.
# Production operations are in jobs/jobs.gql

# Create a new video analysis job
mutation CreateExampleJob($videoUrl: String!, $source: String!, $taskType: String!)
@auth(level: PUBLIC) {
  videoJob_insert(
    data: {
      videoUrl: $videoUrl
      source: $source
      taskType: $taskType
      status: "QUEUED"
      executedAgents: []
    }
  )
}

# Record a job event (e.g., agent start/complete, status change)
mutation RecordExampleEvent($jobId: UUID!, $eventType: String!, $agent: String, $details: String)
@auth(level: PUBLIC) {
  jobEvent_insert(
    data: {
      job: { id: $jobId }
      eventType: $eventType
      agent: $agent
      details: $details
    }
  )
}

# Delete a specific job event
mutation DeleteExampleEvent($id: UUID!) @auth(level: PUBLIC) {
  jobEvent_delete(id: $id)
}
